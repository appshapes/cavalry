[package]
name = "cavalry-bench"
description = "The latency and throughput harness behind `just bench`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published: it is a gate, not a library (ADR 0003).
publish = false

[[bin]]
name = "cavalry-bench"
path = "src/main.rs"

[dependencies]
cavalry-shm = { path = "../crates/cavalry-shm" }
# The client row: publish to delivery through the public API and a real driver in this
# process, so the gate holds the path a user takes to the budget (ADR 0021).
cavalry-client = { path = "../crates/cavalry-client" }
cavalry-driver = { path = "../crates/cavalry-driver" }
# The record row: the recorder's block path, one scan and one positional write per block
# into a segment file, under the counting allocator (ADR 0025).
cavalry-log = { path = "../crates/cavalry-log" }
# The histograms every number comes from: p50, p99, p99.99 and max, never a mean
# (CLAUDE.md, invariant 2; ADR 0015). Fixed bounds, so recording never allocates.
hdrhistogram = "7"
# The counting allocator behind the zero-allocations-per-message assertion (CLAUDE.md,
# gate 2). It carries the `unsafe` a global allocator needs, so this crate carries none.
stats_alloc = "0.1"
# `--pin`: each measured thread on a CPU of its own on the bench host (ADR 0016). It
# carries the `unsafe` the affinity call needs, so this crate carries none.
core_affinity = "0.8"
# The harness's clock for every sample: the time stamp counter, read with `rdtsc` on x86_64
# and `cntvct_el0` on aarch64, calibrated once against the monotonic clock, with that clock
# as the fallback where the counter is not invariant. The OS clock through the vDSO was
# the bench's own tail: the housekeeping CPU's tick rewrites the timekeeper's data a
# thousand times a second, and the next reader on a pinned core paid 1.4 µs on the second
# bench host and 280 ns on the first, once a millisecond, which is the p99.99 (ADR 0028).
# Its wasm dependencies are target-gated and never built here. Not a data-plane crate.
quanta = "0.13.0"

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. The harness is not on the data plane: it measures it.
[package.metadata.cavalry]
data_plane = false
