[package]
name = "cavalry-bench"
description = "The latency and throughput harness behind `just bench`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published: it is a gate, not a library (ADR 0003).
publish = false

[[bin]]
name = "cavalry-bench"
path = "src/main.rs"

[dependencies]
cavalry-shm = { path = "../crates/cavalry-shm" }
# The client row: publish to delivery through the public API and a real driver in this
# process, so the gate holds the path a user takes to the budget (ADR 0021).
cavalry-client = { path = "../crates/cavalry-client" }
cavalry-driver = { path = "../crates/cavalry-driver" }
# The histograms every number comes from: p50, p99, p99.99 and max, never a mean
# (CLAUDE.md, invariant 2; ADR 0015). Fixed bounds, so recording never allocates.
hdrhistogram = "7"
# The counting allocator behind the zero-allocations-per-message assertion (CLAUDE.md,
# gate 2). It carries the `unsafe` a global allocator needs, so this crate carries none.
stats_alloc = "0.1"
# `--pin`: each measured thread on a CPU of its own on the bench host (ADR 0016). It
# carries the `unsafe` the affinity call needs, so this crate carries none.
core_affinity = "0.8"

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. The harness is not on the data plane: it measures it.
[package.metadata.cavalry]
data_plane = false
