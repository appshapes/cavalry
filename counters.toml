doctor = ""

# The image's life (spec/udp.md, "The receiver", step 5; ADR 0042): the receiver moves
# it to live when the conductor hands the image over and to ended, timed out or
# unsubscribed when it retires it; the conductor moves it to removed when it has
# unlinked the log.

[[state_machine]]
name = "image"
states = ["pending", "live", "ended", "timed_out", "unsubscribed", "removed"]

[[transition]]
machine = "image"
from = "pending"
to = "live"
counter = "image.created"

[[transition]]
machine = "image"
from = "live"
to = "ended"
counter = "image.ended"

[[transition]]
machine = "image"
from = "live"
to = "timed_out"
counter = "image.timed_out"

[[transition]]
machine = "image"
from = "live"
to = "unsubscribed"
counter = "image.unsubscribed"

[[transition]]
machine = "image"
from = "ended"
to = "removed"
counter = "image.removed"

[[transition]]
machine = "image"
from = "timed_out"
to = "removed"
counter = "image.removed"

[[transition]]
machine = "image"
from = "unsubscribed"
to = "removed"
counter = "image.removed"

# The publication's connection over UDP and the endpoint's life (spec/udp.md, "The
# sender" and "The receiver"; ADR 0040, ADR 0041). The sender moves the connection's
# counters; the conductor moves the endpoint's.

[[counter]]
id = 101
name = "sender.flow_control_receivers_timed_out"
kind = "counter"
scope = "static"
doc = "Receivers dropped from a min publication's table for no status message within the flow control receiver timeout, 5 s; one dropped because its last status message carried end of stream, as every receiver's does after a clean close, is not counted; the sender limit then follows the slowest of the receivers that remain (spec/udp.md, The sender; ADR 0053, ADR 0054)."
doctor = "A destination whose driver stopped answering held the stream back for the timeout: check that its driver runs and that its subscription is live, or remove the destination with remove destination; sender.flow_control_receivers says how many answer now."

[[counter]]
id = 102
name = "sender.flow_control_receivers_full"
kind = "counter"
scope = "static"
doc = "Status messages from a receiver a min publication's full table of 64 does not hold: accepted for the connection and not tracked, so the sender limit does not follow that receiver (spec/udp.md, The sender; ADR 0053)."
doctor = "More than 64 receivers answered one min publication within 5 s, which 64 destinations never produce: a receiver that restarts draws a new receiver id each time, so a flapping destination fills the table; find it from its driver's image.created."

[[counter]]
id = 103
name = "sender.flow_control_receivers"
kind = "gauge"
scope = "instance"
doc = "The receivers in one cavalry:udp publication's min table, each answering within the flow control receiver timeout, and once the publication is closed each whose stream ended too, kept until the linger ends, so that a clean close leaves it at the receivers that took the stream to its end; 0 under max, which keeps no table; key as sender.position; label text: sender.position's four, then the publication's strategy as fc=max or fc=min, space-separated, so that doctor reads which publications keep a table (ADR 0053, ADR 0056)."
doctor = "A min publication whose receivers are fewer than its endpoint's channel.destinations has a destination that is not answering: the stream waits for it until the timeout drops it, then runs without it."

[[counter]]
id = 104
name = "channel.destinations"
kind = "gauge"
scope = "instance"
doc = "How many destinations one send endpoint of a control channel sends to, added with add destination and removed with remove destination; 0 on any other endpoint; key and label as channel.status (spec/udp.md, The sender; ADR 0053)."
doctor = "A control channel's endpoint with 0 destinations sends nothing: add one with add destination on a publication of the channel."

[[counter]]
id = 105
name = "recording.armed"
kind = "counter"
scope = "static"
doc = "Start recording commands on a cavalry:udp stream with a live subscription and no live publication or image, answered with operation success and held as an armed recording, at most one per receive endpoint and stream with a live subscription, so the subscriptions registry bounds them, until the stream's next image arrives or its last subscription on the endpoint goes; each ends in one of recording.armed_started, recording.armed_failed and recording.armed_dropped, so this counter less those three is the recordings armed or starting (spec/client-protocol.md, Commands, start recording; ADR 0059)."
doctor = "recording.armed above recording.armed_started plus recording.armed_failed plus recording.armed_dropped is armed recordings waiting for an image that has not arrived, or starting: check the publisher and the channel, and that the subscription's endpoint is the one the publication sends to."

[[counter]]
id = 106
name = "recording.armed_started"
kind = "counter"
scope = "static"
doc = "Armed recordings that started when the stream's next image arrived, at the image's join position, before the image was announced, recording ready sent to the arming client with the arming command's correlation id, the command's second answer after its operation success (spec/client-protocol.md, Commands, start recording; ADR 0059)."
doctor = ""

[[counter]]
id = 107
name = "recording.armed_dropped"
kind = "counter"
scope = "static"
doc = "Armed recordings dropped because the last subscription on their receive endpoint and stream went before an image arrived, by remove subscription, client close or client timeout, a receive endpoint that closes being one case of it, since the receiver creates no image for a stream no subscription wants; the arming command is answered a second time with error code 20 (spec/client-protocol.md, Commands, start recording; ADR 0059)."
doctor = "A dropped armed recording recorded nothing: its stream's last subscription on the endpoint was removed, or its client closed or timed out, before the image arrived. Keep a subscription on the stream open until the image arrives, then the recording starts on its own; check client.timed_out if nobody removed it."

[[counter]]
id = 108
name = "recording.armed_failed"
kind = "counter"
scope = "static"
doc = "Armed recordings whose start failed when the stream's next image arrived, at a step a start on a live image fails at: the recordings registry, the recorder's request queue, the catalog or the counters file at capacity (code 10), or the recording's files not created (code 12). Each also counts in that step's counter, driver.registry_full, recording.catalog_full or recording.start_failed; the arming command is answered a second time with error and the code, and the image is announced all the same and no longer held by the recording (spec/client-protocol.md, Commands, start recording; ADR 0059)."
doctor = "An armed recording failed to start and records nothing: read driver.registry_full, recording.catalog_full and recording.start_failed to see which step failed, fix that as their findings say, then send start recording again on the live image."

[[state_machine]]
name = "publication_connection"
states = ["disconnected", "connected"]

[[transition]]
machine = "publication_connection"
from = "disconnected"
to = "connected"
counter = "publication.connected"

[[transition]]
machine = "publication_connection"
from = "connected"
to = "disconnected"
counter = "publication.disconnected"

[[state_machine]]
name = "channel"
states = ["initializing", "active", "closing", "errored"]

[[transition]]
machine = "channel"
from = "initializing"
to = "active"
counter = "channel.opened"

[[transition]]
machine = "channel"
from = "active"
to = "closing"
counter = "channel.closed"

# A client's counters (spec/client-protocol.md, "Commands", add counter; ADR 0062): a
# client adds one of these with the key and the label it gives, and writes its value.
# The consensus module of the replicated log is the first such client (ADR 0060).

[[counter]]
id = 109
name = "cluster.commit_position"
kind = "gauge"
scope = "client"
doc = "The commit position one cluster member knows: the position the leader has found a quorum has appended, which never falls; an entry at or below it is committed and a service reads nothing above it (spec/cluster.md, The log). The member's consensus module adds the counter and stores the value with a release store; a service loads it with an acquire load before it polls the log; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A cluster.commit_position that stays where it is while the member's recording.position moves is a commit that waits for a quorum: check that a majority of the members in the members string are running and that each reaches the others' consensus endpoints."

[[counter]]
id = 110
name = "cluster.role"
kind = "gauge"
scope = "client"
doc = "One cluster member's role: 0 follower, 1 candidate, 2 leader (spec/cluster.md, Counters). The member's consensus module adds the counter and stores it; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 111
name = "cluster.election_state"
kind = "gauge"
scope = "client"
doc = "The state of one cluster member's election, the code spec/cluster.md, Roles and the election, gives it, 17 when no election runs; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that stays at 1, canvass, has found no leader it can follow: the appointed leader is not running, cannot be reached on the consensus endpoints, or holds a log behind this member's. A leader that stays at 8, leader ready, waits for a member that has not joined its log, for at most 10 s."

[[counter]]
id = 112
name = "cluster.leadership_term_id"
kind = "gauge"
scope = "client"
doc = "The term one cluster member leads or follows, -1 before the first; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 113
name = "cluster.append_position"
kind = "gauge"
scope = "client"
doc = "One cluster member's append position: the end of the contiguous span its recordings of the log hold, as a sync has made it durable (spec/cluster.md, The log; ADR 0060); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "An append position behind the leader's on one member is a recorder whose disk syncs slowly, or a member the log no longer reaches: compare its recording.synced_position and its cluster.election_state."

[[counter]]
id = 114
name = "cluster.elections"
kind = "counter"
scope = "client"
doc = "Elections one cluster member began, from init (spec/cluster.md, Counters); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 115
name = "cluster.elections_failed"
kind = "counter"
scope = "client"
doc = "Elections of one cluster member that failed in a state and began again at init: in this version a member that could join the leader's log only with a catch-up or a truncation, about ten a second while it canvasses (spec/cluster.md, The appointed leader); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "This member started after the cluster's first entry, or lost what it held: it cannot join until the catch-up is built. Start the cluster again as a new cluster, every member on a new log directory."

[[counter]]
id = 116
name = "cluster.terms_led"
kind = "counter"
scope = "client"
doc = "Terms one cluster member began to lead, on entering leader log replication (spec/cluster.md, Counters); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 117
name = "cluster.quorum_lost"
kind = "counter"
scope = "client"
doc = "Times the active members of the leader fell below a quorum: the appointed leader stays the leader and its commit position stops (spec/cluster.md, The appointed leader); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The leader hears from fewer than a quorum of members: check that a majority of the members in the members string are running and that each reaches the leader's consensus endpoint. Nothing is committed until a quorum reports again."

[[counter]]
id = 118
name = "cluster.leader_heartbeat_timeouts"
kind = "counter"
scope = "client"
doc = "Times one follower began again at init because its leader sent no commit position and no new leadership term for the leader heartbeat timeout, 10 s (spec/cluster.md, Roles and the election); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The follower lost its leader's consensus messages: check that the leader is running and reaches this member's consensus endpoint."

[[counter]]
id = 119
name = "cluster.leadership_terms_ignored"
kind = "counter"
scope = "client"
doc = "New leadership terms one cluster member ignored for their term (spec/cluster.md, Messages during an election); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 120
name = "cluster.join_position_mismatches"
kind = "counter"
scope = "client"
doc = "Images of the leader's log that joined at a position other than the member's append position, so that the member failed its election (spec/cluster.md, state 15); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The leader appended while this member was subscribing or away, and this version has no catch-up: the member stays out. Start the cluster again as a new cluster, every member on a new log directory."

[[counter]]
id = 121
name = "cluster.log_images_lost"
kind = "counter"
scope = "client"
doc = "Times one follower's image of its leader's log was no longer available, so that it began again at init (spec/cluster.md, The commit position); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The leader's log stopped reaching this member: check that the leader is running and reaches this member's log endpoint."

[[counter]]
id = 122
name = "cluster.messages_rejected"
kind = "counter"
scope = "client"
doc = "Messages of the consensus stream one cluster member rejected, for any reason of spec/cluster.md, What a reader rejects; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member sends consensus messages this member cannot read: check that every member runs the same version."

# A cluster member's role (spec/cluster.md, "Roles and the election"; ADR 0052, feature
# 3). In this version a follower becomes the leader by appointment and no member is a
# candidate or stops leading (ADR 0063).

[[state_machine]]
name = "cluster_role"
states = ["follower", "candidate", "leader"]

[[transition]]
machine = "cluster_role"
from = "follower"
to = "leader"
counter = "cluster.terms_led"

# A cluster member's election, the states of spec/cluster.md this version enters (ADR
# 0063). The transitions that begin an election, give it a leader or end it in failure
# are counted; the steps between them are read from cluster.election_state, and a
# counter for each is the election's (ADR 0052, feature 4).

[[state_machine]]
name = "cluster_election"
states = ["init", "canvass", "leader_log_replication", "leader_replay", "leader_init", "leader_ready", "follower_replay", "follower_log_init", "follower_log_await", "follower_ready", "closed"]

[[transition]]
machine = "cluster_election"
from = "init"
to = "canvass"
counter = "cluster.elections"

[[transition]]
machine = "cluster_election"
from = "canvass"
to = "leader_log_replication"
counter = "cluster.terms_led"

[[transition]]
machine = "cluster_election"
from = "canvass"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "follower_replay"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "follower_log_await"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "follower_log_await"
to = "init"
counter = "cluster.join_position_mismatches"

[[transition]]
machine = "cluster_election"
from = "follower_ready"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "closed"
to = "init"
counter = "cluster.leader_heartbeat_timeouts"

[[transition]]
machine = "cluster_election"
from = "closed"
to = "init"
counter = "cluster.log_images_lost"
