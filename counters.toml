kind = "counter"
scope = "static"
doc = "Armed recordings whose start failed when the stream's next image arrived, at a step a start on a live image fails at: the recordings registry, the recorder's request queue, the catalog or the counters file at capacity (code 10), or the recording's files not created (code 12). Each also counts in that step's counter, driver.registry_full, recording.catalog_full or recording.start_failed; the arming command is answered a second time with error and the code, and the image is announced all the same and no longer held by the recording (spec/client-protocol.md, Commands, start recording; ADR 0059)."
doctor = "An armed recording failed to start and records nothing: read driver.registry_full, recording.catalog_full and recording.start_failed to see which step failed, fix that as their findings say, then send start recording again on the live image."

[[state_machine]]
name = "publication_connection"
states = ["disconnected", "connected"]

[[transition]]
machine = "publication_connection"
from = "disconnected"
to = "connected"
counter = "publication.connected"

[[transition]]
machine = "publication_connection"
from = "connected"
to = "disconnected"
counter = "publication.disconnected"

[[state_machine]]
name = "channel"
states = ["initializing", "active", "closing", "errored"]

[[transition]]
machine = "channel"
from = "initializing"
to = "active"
counter = "channel.opened"

[[transition]]
machine = "channel"
from = "active"
to = "closing"
counter = "channel.closed"

# A client's counters (spec/client-protocol.md, "Commands", add counter; ADR 0062): a
# client adds one of these with the key and the label it gives, and writes its value.
# The consensus module of the replicated log is the first such client (ADR 0060).

[[counter]]
id = 109
name = "cluster.commit_position"
kind = "gauge"
scope = "client"
doc = "The commit position one cluster member knows: the position the leader has found a quorum has appended, which never falls; an entry at or below it is committed and a service reads nothing above it (spec/cluster.md, The log). The member's consensus module adds the counter and stores the value with a release store; a service loads it with an acquire load before it polls the log; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A cluster.commit_position that stays where it is while the member's recording.position moves is a commit that waits for a quorum: check that a majority of the members in the members string are running and that each reaches the others' consensus endpoints."

# The counts of one cluster member's consensus module (spec/cluster.md, "Counters";
# ADR 0063; ADR 0067): each a client counter the module adds with its member id as the
# key, and stores from `cavalry_raft::Counts::by_counter`, which names these constants.

[[counter]]
id = 110
name = "cluster.elections"
kind = "counter"
scope = "client"
doc = "Elections one cluster member began, from init: on starting, and each time it begins again after a failed or lost election (spec/cluster.md, Roles and the election). At most one more than cluster.elections_closed and cluster.elections_failed together, the one more being the election under way; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A cluster.elections that keeps rising is a member that keeps beginning again: read cluster.elections_failed, cluster.leader_heartbeat_timeouts and cluster.log_images_lost on the same member to see why each election ended, and on a member that elects cluster.leader_quorum_losses, cluster.leader_step_downs and cluster.higher_terms_seen too."

[[counter]]
id = 111
name = "cluster.terms_led"
kind = "counter"
scope = "client"
doc = "Terms one cluster member began to lead, on entering leader log replication: cluster.role going to leader (spec/cluster.md, The appointed leader); key and label as cluster.elections."
doctor = ""

[[counter]]
id = 112
name = "cluster.leader_quorum_losses"
kind = "counter"
scope = "client"
doc = "Times the active members of one cluster leader fell below a quorum, a member being active while its last report is younger than the leader heartbeat timeout, 10 s; a leader that elects holds an election, beginning at init, a failed election when it was in leader log replication or leader ready, and the appointed leader stays the leader and its commit position stops until a quorum reports again (spec/cluster.md, The commit position and The appointed leader; ADR 0082); key and label as cluster.elections."
doctor = "The leader cannot commit while fewer than a quorum of members report to it: check that a majority of the members in the members string are running and that each reaches the leader's consensus endpoint."

[[counter]]
id = 113
name = "cluster.appointed_leader_behind"
kind = "counter"
scope = "client"
doc = "Members the appointed leader found holding a log ahead of its own, in canvass or in leader ready, once for each such member in an election; the leader does not lead, or does not close its election, while one reports so (spec/cluster.md, The appointed leader); key and label as cluster.elections."
doctor = "The appointed leader, the member with the lowest id, holds less of the log than another member, as after it lost its log directory, and the cluster will not elect it: restore the leader's log directory, or start the cluster again on empty log directories; a cluster started with cavalry run, whose leader is appointed, has no catch-up."

[[counter]]
id = 114
name = "cluster.log_images_lost"
kind = "counter"
scope = "client"
doc = "Times one cluster follower's image of its leader's log was no longer available, so that it began its election again at init (spec/cluster.md, Roles and the election); key and label as cluster.elections."
doctor = "The follower lost the leader's log stream: check the network path from the leader's log endpoint to this member and the image counters of stream 100 on this member's driver."

[[counter]]
id = 115
name = "cluster.elections_failed"
kind = "counter"
scope = "client"
doc = "Elections one cluster member failed in a state and began again at init: a log it cannot join without a truncation, a replication or a catch-up, an image of the log that joined at another position, or a step that made no progress for the leader heartbeat timeout, 10 s; and, for a leader that elects, in leader log replication or leader ready, a canvass position with a term above its own or active members that fell below a quorum (spec/cluster.md, Roles and the election; ADR 0082); key and label as cluster.elections."
doctor = "A member whose elections keep failing cannot join its leader's log as it stands: read cluster.join_position_mismatches on it. A member started with cavalry run has an appointed leader and no catch-up, so one that started after the leader's first entry, or on a log of its own, cannot join: start it on an empty log directory before the leader's first entry. A member that elects is brought onto its leader's log by a truncation, a replication or a catch-up instead. A member that elects and asked its leader for a term it missed, whose cluster.log_replications rose, fails in follower log replication: read cluster.log_replications_unavailable on it, which rises when the replay it asked for stopped arriving, and see that counter's text. A member that elects and joined its leader's term behind the leader's log, whose cluster.catchups rose, fails in the catch-up when its catch-up position does not leave, when no replay arrives, or when its cluster.append_position does not move, each for 10 s: check that the leader's host can reach this member's catchup endpoint, and that cluster.catchups rose on the leader too."

[[counter]]
id = 116
name = "cluster.leader_heartbeat_timeouts"
kind = "counter"
scope = "client"
doc = "Times one cluster follower heard nothing from its leader for the leader heartbeat timeout, 10 s, and began its election again at init (spec/cluster.md, Roles and the election); key and label as cluster.elections."
doctor = "The follower stopped hearing its leader: check that the leader is running, that the leader's cluster.leader_quorum_losses did not rise, and that this member reaches the leader's consensus endpoint."

[[counter]]
id = 117
name = "cluster.leadership_terms_ignored"
kind = "counter"
scope = "client"
doc = "New leadership term messages one cluster member ignored for their term: below its candidate term in canvass, or not the term it follows once it has taken a leader (spec/cluster.md, Messages during an election); key and label as cluster.elections."
doctor = ""

[[counter]]
id = 118
name = "cluster.join_position_mismatches"
kind = "counter"
scope = "client"
doc = "Images of the log that joined one cluster member somewhere other than where its log ends, so that it failed its election and left the image: in follower log await, state 15, an image of the live log that joined at a position other than its append position; in follower log replication, state 9, an image of a replay that joined at a position other than the one the member asked from; in follower catch-up await, state 12, the image of a catch-up's replay that joined at a position other than the one the member asked from (spec/cluster.md, Roles and the election, states 9, 12 and 15; ADR 0086, ADR 0088, ADR 0092); key and label as cluster.elections."
doctor = "In follower log await, state 15: the member subscribed to the log after the leader had appended past its append position, and joining there would leave a hole in its log: start it on an empty log directory before the leader's first entry; a member started with cavalry run has an appointed leader and no catch-up, and one that elects fails here once and then catches up. In follower catch-up await, state 12, on a member whose cluster.catchups rose, and in follower log replication, state 9, on a member whose cluster.log_replications rose because it asked its leader for a term it missed: a replay reached this member's catchup endpoint at a position other than the one it asked from, so it was a replay this member did not ask for. Do not empty this member's log directory for it. Check, on every host, that no two members share a catchup endpoint in the members string: a leader replays to the endpoint its own members string names, so a replay that another member asked for can arrive here. Then read cluster.log_replications and cluster.catchups on the leader and on the other members to find which member asked. This member asks again at its next election."

[[counter]]
id = 119
name = "cluster.election_steps"
kind = "counter"
scope = "client"
doc = "Steps of one cluster member's election from one state to the next that neither begin it, fail it, close it nor make the member a leader: canvass to follower replay, follower replay to follower log init, follower log init to follower log await, follower log await to follower ready, leader log replication to leader replay, leader replay to leader init and leader init to leader ready (ADR 0067); and, for a member that elects, canvass to nominate, and nominate, candidate ballot and follower ballot to follower replay, a candidate's step to follower replay also moving cluster.role from candidate to follower (ADR 0081); and canvass, nominate, candidate ballot and follower ballot to follower log replication, a candidate's step there moving cluster.role as its step to follower replay does, and follower log replication to canvass (ADR 0086); and follower replay to follower catch-up init, follower catch-up init to follower catch-up await, follower catch-up await to follower catch-up, follower catch-up to follower log init, and follower log init to follower ready for a member the catch-up left subscribed (ADR 0088) (spec/cluster.md, Counters). With no ballot lost, no term replicated and no catch-up, an election that closes makes three on its leader and four on a follower where the leader is appointed, and four on its leader and four or five on a follower where it is elected, five when the follower went through nominate; a member that nominates itself again after a ballot lost counts canvass to nominate again. A member that replicates a term it missed counts, for each such term, the step into follower log replication, canvass to nominate before it when it went through nominate, and the step back to canvass; then it counts the steps of the path it closes its election on from canvass, as above. So a follower that replicates one term and then joins counts at least six. A follower that joins its leader's term behind the leader's log catches up: from follower replay it counts five steps to follower ready, through the three states of the catch-up and follower log init, where a follower level with its leader counts three, so its election counts two more; key and label as cluster.elections."
doctor = ""

[[counter]]
id = 120
name = "cluster.elections_closed"
kind = "counter"
scope = "client"
doc = "Elections one cluster member closed: leader ready to closed, its term's first entry appended, or follower ready to closed, its append position sent to its leader (spec/cluster.md, Counters; ADR 0067); key and label as cluster.elections."
doctor = "A cluster.elections_closed that stays below cluster.elections minus cluster.elections_failed is an election still running: the member's cluster.election_state gauge (spec/cluster.md, Counters) is the state it waits in, and docs/reference/counters.md, State machines, cluster_election, names the counter of each way out of that state."

# What the consensus module shows of its member beside the counts above (spec/cluster.md,
# "Counters"; ADR 0063): its role, its election's state, its term and its append
# position as gauges, the consensus messages it rejected, and the recording it records
# the live log into, which its service replays (ADR 0066). The module adds each as a
# client counter with its member id as the key, as it adds cluster.commit_position.

[[counter]]
id = 121
name = "cluster.role"
kind = "gauge"
scope = "client"
doc = "One cluster member's role: 0 follower, 1 candidate, 2 leader (spec/cluster.md, Counters). The member's consensus module adds the counter and stores it; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 122
name = "cluster.election_state"
kind = "gauge"
scope = "client"
doc = "The state of one cluster member's election, the code spec/cluster.md, Roles and the election, gives it, 17 when no election runs; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that stays at 1, canvass, has found no leader it can follow: the appointed leader is not running, cannot be reached on the consensus endpoints, or holds a log behind this member's. A leader that stays at 8, leader ready, waits for members to join its log: the appointed leader for every member it has heard, for at most 10 s, and a leader that elects for a quorum, itself among them."

[[counter]]
id = 123
name = "cluster.leadership_term_id"
kind = "gauge"
scope = "client"
doc = "The term one cluster member leads or follows, -1 before the first; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 124
name = "cluster.append_position"
kind = "gauge"
scope = "client"
doc = "One cluster member's append position: the end of the contiguous span its recordings of the log hold, as a sync has made it durable (spec/cluster.md, The log; ADR 0060); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "An append position behind the leader's on one member is a recorder whose disk syncs slowly, or a member the log no longer reaches: compare its recording.synced_position and its cluster.election_state."

[[counter]]
id = 125
name = "cluster.messages_rejected"
kind = "counter"
scope = "client"
doc = "Messages of the consensus stream one cluster member rejected, for any reason of spec/cluster.md, What a reader rejects; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member sends consensus messages this member cannot read: check that every member runs the same version."

[[counter]]
id = 126
name = "cluster.log_recording_id"
kind = "gauge"
scope = "client"
doc = "The id of the recording one cluster member records the live log into, -1 while it records none: the leader's recording of its log publication, or a follower's recording of the leader's image it joined last; the recording its service replays, or reads below through the member's file of its log's recordings (spec/cluster.md, The service and The log's recordings; ADR 0066, ADR 0103). The member's consensus module adds the counter and stores -1 in it before it adds cluster.commit_position, stores a new value in it before it stores a commit position the recording does not hold, and writes the file of its log's recordings before it stores a recording's id in it; key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A cluster.log_recording_id that stays at -1 on a member whose cluster.election_state is 17, its election closed, has one of two causes. A follower whose recording of the leader's image never started, so that its cluster.append_position does not move: its driver's recording.armed_failed counts the failure and names the counter of the step that failed. Or a member that cannot write the file of its log's recordings, whose cluster.log_recordings_unwritten rises while its cluster.append_position moves: see that counter's text. A member in an election holds -1 until it has joined the log."

[[counter]]
id = 127
name = "cluster.candidacies"
kind = "counter"
scope = "client"
doc = "Ballots one cluster member began as a candidate: it stored candidate term + 1, voted for itself and asked every other member for its vote, going from nominate to candidate ballot (spec/cluster.md, Roles and the election, state 3; ADR 0081); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 128
name = "cluster.ballots_lost"
kind = "counter"
scope = "client"
doc = "Ballots that ended with no leader for one cluster member, which went back to canvass: a candidate at the election timeout short of a quorum or with a vote against, a member in follower ballot whose candidate's new leadership term did not come within the election timeout, or either that read a new leadership term for a log term that is not its own and that dropped none of its terms. A candidate that follows another member's new leadership term for its own candidate term has a leader and counts none (spec/cluster.md, Roles and the election, states 3 and 4, and Counters; ADR 0081); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A count that rises with cluster.candidacies on two members at once is a split vote: two candidates whose nomination delays ended within a round trip of each other each voted for itself. The next canvass draws new delays, and the election takes one election timeout, 1 s, longer. A cluster.candidacies that rises on a member with neither this count nor cluster.terms_led is a candidate that followed another member that won the same term, and its election took no longer. A count that keeps rising with no cluster.terms_led on any member is a cluster with no member whose log a quorum will vote for: run cavalry doctor on each member's host and compare cluster.append_position."

[[counter]]
id = 129
name = "cluster.votes_for"
kind = "counter"
scope = "client"
doc = "Votes one cluster member sent for a candidate: a request vote for a term above its candidate term from a candidate whose log is at least its own, read in canvass, nominate or a ballot state; it stored the term first and waits for that candidate in follower ballot (spec/cluster.md, Messages during an election); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 130
name = "cluster.votes_against"
kind = "counter"
scope = "client"
doc = "Votes one cluster member sent against a candidate: a request vote for a term at or below its candidate term, in which it has voted, or for a higher term from a candidate whose log is behind its own (spec/cluster.md, Messages during an election); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = ""

[[counter]]
id = 131
name = "cluster.leader_step_downs"
kind = "counter"
scope = "client"
doc = "Times one cluster leader whose election had closed held an election, beginning at init, on a term above its own: a canvass position with either term, a request vote whose candidate term id or a commit position whose leadership term id above its leadership term id, from another member. It is a follower from then on and gives up its log publication, Raft's step-down (spec/cluster.md, Messages outside an election, and Counters; ADR 0082); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The leader stood still, or was parted from the other members, for longer than the leader heartbeat timeout, 10 s, while they elected another, and gave up the lead when it read the later term. A count that keeps rising on one member is a process that stops again and again: check the host's CPU throttling, and the path between this member's consensus endpoint and each other member's."

[[counter]]
id = 132
name = "cluster.higher_terms_seen"
kind = "counter"
scope = "client"
doc = "Times one cluster follower whose election had closed held an election, beginning at init, on a term above its own: a request vote whose candidate term id or a commit position whose leadership term id above its leadership term id, from another member. The cluster began that term without it, and it joins it through the election it holds (spec/cluster.md, Messages outside an election, and Counters; ADR 0082); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The follower followed a leader the other members had replaced, or another member asked for votes in a later term: this member or its leader was parted from the members that held the ballot. Read cluster.leader_step_downs and cluster.leader_quorum_losses on the member it followed, and check the path between this member's consensus endpoint and each other member's."

[[counter]]
id = 133
name = "cluster.log_truncations"
kind = "counter"
scope = "client"
doc = "Times one cluster member truncated its log to join a leader: a new leadership term named, as the term its leader's record holds next after the member's own, a term whose base lay below the member's append position, and the member cut what it held above that base, with every term it had recorded above it. What it cut is the tail of an older term that no quorum recorded; a committed entry is never cut, and a member told to cut below the commit position it knows refuses and fails its election (spec/cluster.md, Messages during an election, and Counters; ADR 0083); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The member held entries that the leader elected after them does not: it led, or followed a leader, that appended them and lost its quorum before a quorum recorded them. They were never committed, and a session message among them is lost to its client, which learns of the new leader by the new leader event and sends again. A count that rises on a member that never lost its leader is a member whose log directory holds another cluster's log: compare cluster.leadership_term_id and cluster.append_position on each member's host."

[[counter]]
id = 134
name = "cluster.truncations_refused"
kind = "counter"
scope = "client"
doc = "Times one cluster member was told, by a new leadership term, to truncate its log to a position below the commit position it knows, and did not: it kept its log and failed its election, counted in cluster.elections_failed too. A committed entry is never truncated, and a leader that holds what was committed names no such position (spec/cluster.md, Messages during an election, and Counters; ADR 0083); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "This should never rise. A leader told this member that its log, below a position this member knows to be committed, is not the leader's: one of the two holds a log that is not this cluster's, a log directory copied from another cluster or restored from an older copy. Stop both, compare cluster.leadership_term_id, cluster.append_position and cluster.commit_position on every member's host, and start again only the members that agree."

[[counter]]
id = 135
name = "cluster.log_replications"
kind = "counter"
scope = "client"
doc = "Times one cluster member replicated, or served, a span of the log below the leader's term base log position, a term the member missed: on a follower, a catch-up position it sent from follower log replication, one for each replay it asked for; on the leader, a replay of its own recordings that it started for such a member, once for each replay where the span lies in several recordings (spec/cluster.md, follower log replication, Messages outside an election, and Counters; ADR 0085, ADR 0086, ADR 0092); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that was down or cut off while the cluster elected a leader replicates the terms it missed from the new leader's recordings. This rises by one on the member for each replay it asks for and by one on the leader for each replay it starts: one for each recording of the leader's that a missed term lies in, so the two rise together. It is how such a member returns, and nothing to act on. If it rises on a leader again and again for one member while that member's cluster.append_position does not move, the member cannot receive the replay: check that its catchup endpoint in the members string is the one its host listens on and that the leader's host can reach it."

[[counter]]
id = 136
name = "cluster.log_replications_unavailable"
kind = "counter"
scope = "client"
doc = "Times one cluster member failed its election in follower log replication because its append position stayed below its stop position without moving for the leader heartbeat timeout: the leader's recordings do not hold the span, purged by retention, a replay stopped for a fault, or the replay never reached the member's catchup endpoint. Counted in cluster.elections_failed too (spec/cluster.md, follower log replication, and Counters; ADR 0086); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "This member asked its leader for a term it missed and nothing more arrived for 10 s. Check, on the leader's host, that its recordings still hold the log from this member's cluster.append_position: where a retention purged it, this member cannot rejoin from the log at all, and this version has no snapshot to bring it back with, so the leader's log must be kept until every member has it. Check that this member's catchup endpoint in the members string is the same on both hosts and that the leader's host can reach it: a leader replays to the endpoint its own members string names. If cluster.log_replications rises on the leader for this member each time, the replays start and do not arrive."

[[counter]]
id = 137
name = "cluster.catchups"
kind = "counter"
scope = "client"
doc = "Times one cluster member began, or served, a catch-up within the leader's term: on a follower, a catch-up position it sent from follower catch-up init; on the leader, a replay of its live recording that it started for such a member, which follows the recording until the leader stops it (spec/cluster.md, follower catch-up init, Messages outside an election, and Counters; ADR 0087, ADR 0088); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that joined its leader's term behind the leader's log catches up from the leader's live recording. This rises by one on the member for each catch-up position it sends, and by one on the leader for each replay it starts for that member. It stays 0 on every member started with cavalry run, whose leader is appointed. It is how such a member returns, and nothing to act on. If it rises on a leader again and again for one member while that member's cluster.append_position does not reach the leader's, the member cannot keep up with the replay or cannot receive it: check that its catchup endpoint in the members string is the one its host listens on, and compare its cluster.append_position with the leader's over a few seconds."

[[counter]]
id = 138
name = "cluster.terms_dropped"
kind = "counter"
scope = "client"
doc = "Times one cluster member dropped from its record of terms the terms its leader's record lacks: a new leadership term named, as the term it answers, a term below the member's own log term, with a next term above it, so the leader's record holds none of the member's terms above the one named, and the member took them out of its record, cutting first what it held above the base of the lowest of them, which is counted in cluster.log_truncations too (spec/cluster.md, Messages during an election, and Counters; ADR 0096); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "The member had recorded a term that fewer than a quorum recorded: it joined a leader that never had a quorum, or led such a term itself. No entry was ever appended in that term, so nothing is lost; the member's record is its leader's again and it joins. It is how such a member returns, and nothing to act on. If cluster.truncations_refused rises with it on the same member, the member holds entries above a term it recorded so and knows a commit position among them: read cluster.leadership_term_id and cluster.commit_position on that member and on its leader."

[[counter]]
id = 140
name = "cluster.leader_member_id"
kind = "gauge"
scope = "client"
doc = "The id of the member one cluster member leads as or follows, -1 while it has none: from init until it leads a term or takes a leader's new leadership term, so through canvass, nominate and the two ballots (spec/cluster.md, Counters; ADR 0077, ADR 0102); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that reads -1 has no leader: read its cluster.election_state for where its election stands and its cluster.election_cause for why it began. Two members that read different ids while both elections are closed are on two sides of a partition, or one has not yet heard of a later term: the member whose cluster.leadership_term_id is lower is the one behind."

[[counter]]
id = 141
name = "cluster.election_cause"
kind = "gauge"
scope = "client"
doc = "Why one cluster member's last election began, the election it is in or the one that closed last: 0 the member started; 1 it followed and its leader said nothing for the leader heartbeat timeout; 2 it followed and its image of the leader's log was no longer available; 3 it led and its active members fell below a quorum; 4 its election had closed and a message carried a term above its own; 5 its election before failed (spec/cluster.md, Counters; ADR 0077, ADR 0102); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "0 is a start and nothing to act on. 1 and 2 on a follower say its leader stopped or could not be reached: look at the leader's process and at the path between the two members' consensus and log endpoints. 3 on a member that led says it could no longer hear a quorum: it is the member that was cut off. 4 says another member held a later term, which is what a member sees when it comes back from a partition. 5 says the election before this one did not close: read cluster.elections_failed and the counters beside it, cluster.join_position_mismatches, cluster.truncations_refused and cluster.log_replications_unavailable, for which rule failed it."

[[counter]]
id = 143
name = "cluster.log_recordings_unwritten"
kind = "counter"
scope = "client"
doc = "Duty cycles in which one cluster member had a recording of its log to name and could not write the file of its log's recordings, log-recordings-<member id> in its driver directory: the member stored -1 in cluster.log_recording_id, named no recording to a service, and tried again in the next cycle (spec/cluster.md, The log's recordings, and Counters; ADR 0103); key: member id (i32), little-endian; label text: the member id in decimal."
doctor = "A member that counts here cannot write in its driver's directory, and no service beside it reads the log while that lasts. The member's own error names the file and the cause: check that the driver directory is writable by the member's user and that its file system has room. The count stops rising once a cycle has written the file, and cluster.log_recording_id then names the recording. A member started with cavalry run tries a cycle that fails again every 100 ms, so the count rises by about ten a second, and after 10 s of such cycles cavalry run gives the member up and stops it: start it again once its directory can be written."

# A cluster member's role (spec/cluster.md, "Roles and the election"; ADR 0052, feature
# 3). A member whose leader is appointed becomes the leader from follower, and no
# member is a candidate (ADR 0063). A member that elects (ADR 0077, ADR 0081) is a
# candidate from its nomination until it leads, loses its ballot, votes for another,
# follows another member that won its candidate term, or fails its election on such a
# member's term when it cannot join it. Candidate to follower is listed with the
# counter of each of those four causes. A leader that elects stops leading when it
# holds an election, a follower from the same call (ADR 0082): on a term above its own
# once its election has closed, when its active members fall below a quorum, and when
# its election fails in leader log replication or leader ready. Leader to follower is
# listed with the counter of each of those three causes; the appointed leader never
# stops leading.

[[state_machine]]
name = "cluster_role"
states = ["follower", "candidate", "leader"]

[[transition]]
machine = "cluster_role"
from = "follower"
to = "leader"
counter = "cluster.terms_led"

[[transition]]
machine = "cluster_role"
from = "follower"
to = "candidate"
counter = "cluster.candidacies"

[[transition]]
machine = "cluster_role"
from = "candidate"
to = "leader"
counter = "cluster.terms_led"

[[transition]]
machine = "cluster_role"
from = "candidate"
to = "follower"
counter = "cluster.ballots_lost"

[[transition]]
machine = "cluster_role"
from = "candidate"
to = "follower"
counter = "cluster.votes_for"

[[transition]]
machine = "cluster_role"
from = "candidate"
to = "follower"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_role"
from = "candidate"
to = "follower"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_role"
from = "leader"
to = "follower"
counter = "cluster.leader_step_downs"

[[transition]]
machine = "cluster_role"
from = "leader"
to = "follower"
counter = "cluster.leader_quorum_losses"

[[transition]]
machine = "cluster_role"
from = "leader"
to = "follower"
counter = "cluster.elections_failed"

# The election as one member's core holds it, `cavalry_raft::ElectionState`: the states
# of the appointed leader's path (spec/cluster.md, "Roles and the election" and "The
# appointed leader"; ADR 0063, ADR 0067) and, for a member that elects, nominate and
# the two ballots (ADR 0077, ADR 0081), the elections a leader holds (ADR 0082), and
# follower log replication, which a member enters from the four states that read a
# new leadership term and leaves for canvass at its stop (ADR 0086), and the three
# states of the catch-up within a leader's term, which a member behind its leader's
# log enters from follower replay and leaves for follower log init, already
# subscribed, so that follower log init then steps to follower ready (ADR 0088).
# Each transition the core makes is listed with every counter it adds one to; a
# transition with more than one cause, closed to init with five, is listed with the
# counter of each cause. A leader that elects and loses its quorum in leader log
# replication or leader ready adds one to both counters of its row.
[[state_machine]]
name = "cluster_election"
states = ["init", "canvass", "nominate", "candidate_ballot", "follower_ballot", "leader_log_replication", "leader_replay", "leader_init", "leader_ready", "follower_log_replication", "follower_replay", "follower_catchup_init", "follower_catchup_await", "follower_catchup", "follower_log_init", "follower_log_await", "follower_ready", "closed"]

[[transition]]
machine = "cluster_election"
from = "init"
to = "canvass"
counter = "cluster.elections"

[[transition]]
machine = "cluster_election"
from = "init"
to = "leader_log_replication"
counter = "cluster.elections"

[[transition]]
machine = "cluster_election"
from = "init"
to = "leader_log_replication"
counter = "cluster.terms_led"

[[transition]]
machine = "cluster_election"
from = "canvass"
to = "leader_log_replication"
counter = "cluster.terms_led"

[[transition]]
machine = "cluster_election"
from = "canvass"
to = "follower_replay"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "canvass"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "leader_log_replication"
to = "leader_replay"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "leader_replay"
to = "leader_init"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "leader_init"
to = "leader_ready"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "leader_ready"
to = "closed"
counter = "cluster.elections_closed"

[[transition]]
machine = "cluster_election"
from = "follower_replay"
to = "follower_log_init"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "follower_replay"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "follower_log_init"
to = "follower_log_await"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "follower_log_await"
to = "follower_ready"
counter = "cluster.election_steps"

[[transition]]
machine = "cluster_election"
from = "follower_log_await"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "follower_log_await"
to = "init"
counter = "cluster.join_position_mismatches"

[[transition]]
machine = "cluster_election"
from = "follower_ready"
to = "closed"
counter = "cluster.elections_closed"

[[transition]]
machine = "cluster_election"
from = "follower_ready"
to = "init"
counter = "cluster.elections_failed"

[[transition]]
machine = "cluster_election"
from = "closed"
to = "init"
counter = "cluster.leader_heartbeat_timeouts"

[[transition]]
machine = "cluster_election"
from = "closed"
to = "init"
counter = "cluster.log_images_lost"

