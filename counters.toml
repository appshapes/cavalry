# Every counter Cavalry has, in one place (CLAUDE.md, invariant 4; spec/counters-file.md;
# ADR 0012). docs/reference/counters.md and the constants in cavalry-shm are generated
# from this file; `just lint-counters` fails when they are stale or an entry lacks a
# field. Edit here, never there.
#
# id:     stable and never reused; the type id in the counters file's metadata record.
# name:   lowercase, dotted, the layout or component first; the label of a static
#         counter, and the prefix of an instance counter's label.
# kind:   "counter" never decreases while allocated; "gauge" moves both ways.
# scope:  "static", one counter allocated when the driver starts, in the record whose
#         type id is this id; "instance", one per key, allocated with the instance,
#         with the key's layout stated in doc; "client", one per key, allocated when a
#         client adds it with add counter, written by that client alone and freed when
#         it removes the counter, closes or is timed out (ADR 0062).
# doc:    one sentence for the reference page: what a change in the value means.
# doctor: what an operator does when this counter says something is wrong, or "".
schema = 0

[[counter]]
id = 0
name = "counters.allocated"
kind = "gauge"
scope = "static"
doc = "Metadata records in the allocated state, this counter's own record included."
doctor = ""

[[counter]]
id = 1
name = "counters.allocation_failed"
kind = "counter"
scope = "static"
doc = "Counter allocations refused because every record was in use: the counters file is full, and whatever needed the counter was refused with it."
doctor = "The counters file is full and new publications and subscriptions are refused until a counter is freed: close what is not used; the capacity is fixed in this version."

[[counter]]
id = 2
name = "publication.position"
kind = "gauge"
scope = "instance"
doc = "The producer position of one publication's log buffer, written by the driver on its duty cycle from a load it makes at most once every two milliseconds, so at most two milliseconds behind the publisher (ADR 0022, ADR 0032); key: correlation id (i64), session id (i32), stream id (i32), little-endian; label text: the three in decimal, space-separated."
doctor = ""

[[counter]]
id = 3
name = "publication.limit"
kind = "gauge"
scope = "instance"
doc = "The position up to which one publication may write: the slowest subscriber's position plus the publication window, written by the driver; key and label as publication.position."
doctor = "If publication.position sits at publication.limit, a subscriber is slow or stopped: compare the subscription.position counters of the stream and look at that subscriber."

[[counter]]
id = 4
name = "subscription.position"
kind = "gauge"
scope = "instance"
doc = "How far one subscription has read one publication's stream, written by the subscriber after each poll with a release store; key: correlation id (i64), session id (i32), stream id (i32), little-endian; label text: the three in decimal, space-separated."
doctor = "A subscription.position that does not move while publication.position does is a subscriber that stopped polling; its publisher will be back-pressured when it reaches the window."

[[counter]]
id = 5
name = "publication.unblocked"
kind = "counter"
scope = "static"
doc = "Stale claims the driver turned into padding frames because a publisher claimed and did not commit within the unblock timeout (spec/log-buffer.md, The driver)."
doctor = "A publisher process died or stalled between claim and commit; find it from the publication whose position stopped moving, and keep claim and commit on one thread with nothing blocking between them."

[[counter]]
id = 6
name = "log_buffer.rejected_position"
kind = "counter"
scope = "static"
doc = "Subscriber positions the driver found outside the spec's bounds and refused to use; the client that wrote one is evicted (ADR 0010)."
doctor = "A client wrote an impossible position: a buggy binding or a hostile process. The driver's log names the client; rebuild or remove it."

[[counter]]
id = 7
name = "log_buffer.rejected_tail"
kind = "counter"
scope = "static"
doc = "Tail counters the driver found inconsistent with the active term count and refused to use; the publication is closed (ADR 0010)."
doctor = "A publisher wrote an impossible tail: a buggy binding or a hostile process. The driver's log names the publication; rebuild or remove the client."

[[counter]]
id = 8
name = "log_buffer.rejected_frame"
kind = "counter"
scope = "static"
doc = "Frames a subscriber found outside spec/frame.md's bounds in a term and reported; nothing after such a frame is delivered on that image."
doctor = "A publisher wrote a corrupt frame, or a term was overwritten: check publication.unblocked and the driver's log for the publication."

[[counter]]
id = 9
name = "command_ring.unblocked"
kind = "counter"
scope = "static"
doc = "Padding records the driver wrote over a claim in the command ring that a client made and did not commit within the unblock timeout (spec/command-ring.md, Unblocking)."
doctor = "A client process died or stalled between claiming and committing a command; its own driver timeout closes it. If this repeats, find the client that keeps restarting and look at what stops it between claim and commit."

[[counter]]
id = 10
name = "command_ring.rejected_tail"
kind = "counter"
scope = "static"
doc = "Tail positions the driver found outside the command ring's bounds when it unblocked and refused to use (ADR 0010): the ring is corrupt and the driver reads nothing more from it (spec/command-ring.md, Unblocking)."
doctor = "A client wrote an impossible tail: a buggy binding or a hostile process, which the ring cannot name. Every client's commands now time out. Restart the driver, which recreates the ring; if the counter climbs again, stop clients one at a time until it stops, and look for a binding that was upgraded or does not conform to spec/command-ring.md."

[[counter]]
id = 11
name = "command_ring.rejected_record"
kind = "counter"
scope = "static"
doc = "Records the driver found outside the command ring's bounds, a length or type no client writes by the protocol (ADR 0010): the driver reads nothing more from the ring (spec/command-ring.md, Reading)."
doctor = "A client wrote a corrupt command: a buggy binding or a hostile process, which the ring cannot name. Every client's commands now time out. Restart the driver, which recreates the ring; if the counter climbs again, stop clients one at a time until it stops, and look for a binding that was upgraded or does not conform to spec/command-ring.md."

[[counter]]
id = 12
name = "client.timed_out"
kind = "counter"
scope = "static"
doc = "Clients the driver timed out because no command of theirs arrived within the client liveness timeout; their publications and subscriptions were removed and a client timeout event sent (spec/client-protocol.md, Liveness and timeouts)."
doctor = "A client stopped sending keepalives: it is stuck, paused under a debugger, or its conductor thread died. Its own driver timeout closes it. Find the process by the client id in the client timeout event and look at what stopped its conductor."

[[counter]]
id = 13
name = "client_protocol.rejected_command"
kind = "counter"
scope = "static"
doc = "Commands the driver refused at decoding, for their channel or for a field outside its bound: a message too short to carry a correlation id, an unknown type, a message of the wrong length, a bad string, a channel that is not cavalry:ipc, or a replay length below -1 (spec/client-protocol.md, What the driver rejects); the client got an error event when its correlation id was readable."
doctor = "A client sent a command the protocol does not allow: a binding that does not conform to spec/client-protocol.md or was upgraded apart from the driver. The error event names the command; stop that client and check its version against the driver's."

[[counter]]
id = 14
name = "client_protocol.errors"
kind = "counter"
scope = "static"
doc = "Error events the driver sent, whatever the code: every command this version refused after the ring delivered it (spec/client-protocol.md, Error codes); the causes with a counter of their own are client_protocol.rejected_command, driver.registry_full and driver.log_create_failed."
doctor = "Compare with client_protocol.rejected_command, driver.registry_full and driver.log_create_failed; an error none of them explains is code 2, 3 or 5, a client naming a registration the driver does not know, or code 11, a bug the error event's message names."

[[counter]]
id = 15
name = "driver.registry_full"
kind = "counter"
scope = "static"
doc = "Commands refused with error code 10 because the driver's registry of clients, publications, subscriptions, images, recordings or replays, its bound on replay publications (live or lingering after their replay ended), the recorder's or the replayer's request queue, or the counters file, was at capacity; the error message names which (spec/client-protocol.md, Sizes; ADR 0036)."
doctor = "A fixed capacity of the driver is reached: clients, publications or subscriptions are not being closed, or this host needs more than one driver's worth. Close what is not used; the error event's message names the registry; the capacities are the driver's in this version."

[[counter]]
id = 16
name = "driver.log_create_failed"
kind = "counter"
scope = "static"
doc = "Log buffers the driver could not create or size, refused with error code 12: the filesystem under the driver directory is full or not writable (spec/client-protocol.md, Commands)."
doctor = "Free space on the filesystem under the driver directory (/dev/shm on Linux): each cavalry:ipc publication needs 3 × 64 MiB + 4 KiB there while it is live or lingers. Close publications that are not used, or move the driver directory to a filesystem with room."

[[counter]]
id = 17
name = "conductor.idle_strategy"
kind = "gauge"
scope = "static"
doc = "The idle strategy the conductor runs, what its thread does on a duty cycle that found no work, stored once when the driver starts: 0 backoff, 1 yield, 2 busy-spin."
doctor = ""

[[counter]]
id = 18
name = "counters.allocations"
kind = "counter"
scope = "static"
doc = "Counter allocations made since the driver started, the static counters' own records included: every record that went from unused or reclaimed to allocated, the transition counters.allocated adds one for, so that counters.allocations minus counters.freed is counters.allocated (spec/counters-file.md, Metadata record)."
doctor = ""

[[counter]]
id = 19
name = "counters.freed"
kind = "counter"
scope = "static"
doc = "Counters freed since the driver started: every record that went from allocated to reclaimed, the transition counters.allocated loses one for; a reclaimed record is allocated again after the counter reuse timeout."
doctor = ""

[[counter]]
id = 20
name = "recording.started"
kind = "counter"
scope = "static"
doc = "Recordings the driver started: a catalog slot taken, the time index and the first segment file created, the two position counters allocated and recording ready sent (spec/client-protocol.md, Commands)."
doctor = ""

[[counter]]
id = 21
name = "recording.stopped"
kind = "counter"
scope = "static"
doc = "Recordings the driver stopped, by stop recording, at a publication's end of stream, or after a failed write or a frame that failed its check; each sent recording stopped with the stop position (spec/client-protocol.md, Commands)."
doctor = ""

[[counter]]
id = 22
name = "recording.write_failed"
kind = "counter"
scope = "static"
doc = "Writes or syncs the recorder could not make to a recording's segment file or time index, each of which stopped the recording at the position written (spec/client-protocol.md, Commands)."
doctor = "The log directory's filesystem is full, read-only or failing: `cavalry doctor` names it. Free space, or move the log directory with `--log-dir`, then start the recording again; what was written up to the stop position is whole and replayable."

[[counter]]
id = 23
name = "recording.start_failed"
kind = "counter"
scope = "static"
doc = "Start recording commands refused with error code 12 because the recording's time index or first segment file could not be created in the log directory (spec/client-protocol.md, Commands). The recording's catalog slot may already be taken: a start that fails at its files leaves its slot valid, stopped at the start position, so the catalog's slots used are at most recording.started plus these plus the driver.registry_full refusals of a start."
doctor = "Free space on the log directory's filesystem, or move the directory with `--log-dir`; a recording needs a 128 MiB segment file when it starts."

[[counter]]
id = 24
name = "recording.catalog_full"
kind = "counter"
scope = "static"
doc = "Start recording commands refused with error code 10 because the catalog holds every one of its 1048576 slots (spec/durable-log.md, Catalog header)."
doctor = "The log directory has held 1048576 recordings in its life: move or archive it, and start the driver on a new directory, which gets a new catalog."

[[counter]]
id = 25
name = "recording.recovered"
kind = "counter"
scope = "static"
doc = "Recordings found live, or with a torn stop, when the driver opened the log directory, whose stop fields recovery rebuilt from their files (spec/durable-log.md, The driver)."
doctor = "The previous driver did not stop cleanly; the recordings are whole up to the rebuilt stop. If this climbs at every start, find what kills the driver before `close`."

[[counter]]
id = 26
name = "recording.invalidated"
kind = "counter"
scope = "static"
doc = "Catalog slots recovery set to state 2 because their files cannot repair them: an empty slot before the last, a creation checksum that fails, or a segment file missing between the start and the last (spec/durable-log.md, The driver)."
doctor = "A recording in the log directory is damaged beyond repair and `cavalry doctor` names its slot: check the disk, and restore the directory from a backup if the recording matters; the slot is never reused."

[[counter]]
id = 27
name = "recording.index_rewritten"
kind = "counter"
scope = "static"
doc = "Time indexes recovery wrote again with their start entry, gave a first entry, or truncated to whole entries in order or to the entries at or before the rebuilt stop (spec/durable-log.md, The driver)."
doctor = ""

[[counter]]
id = 28
name = "recording.catalog_truncated"
kind = "counter"
scope = "static"
doc = "Catalog files recovery truncated to whole slots because a crash left bytes past the last slot: 0 or 1 at each driver start (spec/durable-log.md, The driver)."
doctor = ""

[[counter]]
id = 29
name = "recording.slot_dropped"
kind = "counter"
scope = "static"
doc = "Empty last catalog slots recovery dropped because a crash tore a recording's creation: 0 or 1 at each driver start, and the next recording takes the id (spec/durable-log.md, The driver)."
doctor = ""

[[counter]]
id = 30
name = "recording.files_removed"
kind = "counter"
scope = "static"
doc = "Files recovery removed: segment files wholly past a rebuilt stop, and the files of a deleted recording that were still present (spec/durable-log.md, The driver)."
doctor = ""

[[counter]]
id = 31
name = "recording.position"
kind = "gauge"
scope = "instance"
doc = "The position of one recording up to which the recorder has written its segment files, what the operating system holds, stored with a release store after each block; the publisher's limit respects it (spec/log-buffer.md, The driver); key: recording id (i64), little-endian; label text: the recording id, the session id and the stream id in decimal, space-separated."
doctor = "A recording.position that does not move while its publication.position does is a recorder behind a slow or failing disk, and the publisher is back-pressured when it reaches the window: check recording.write_failed and the log directory's disk with `cavalry doctor`."

[[counter]]
id = 32
name = "recording.synced_position"
kind = "gauge"
scope = "instance"
doc = "The position of one recording up to which a sync has made its segment files and time index durable, stored with a release store after each sync, at most a second behind recording.position; key and label as recording.position."
doctor = "A synced position far behind recording.position is a disk whose sync is slow; a power cut loses what lies between the two."

[[counter]]
id = 33
name = "replay.started"
kind = "counter"
scope = "static"
doc = "Replays the driver started: the replay's publication created at the start position, its counters allocated and replay ready sent (spec/client-protocol.md, Commands; ADR 0030)."
doctor = ""

[[counter]]
id = 34
name = "replay.stopped"
kind = "counter"
scope = "static"
doc = "Replays that ended, for any reason: each sent replay stopped with the position reached and the reason; replay.ended, replay.not_connected and replay.failed count the reasons other than a stop replay command (spec/client-protocol.md, Commands)."
doctor = ""

[[counter]]
id = 35
name = "replay.ended"
kind = "counter"
scope = "static"
doc = "Replays that reached their end position or their recording's stop position, reason 0 of replay stopped: the subscriber saw everything it asked for."
doctor = ""

[[counter]]
id = 36
name = "replay.not_connected"
kind = "counter"
scope = "static"
doc = "Replays the driver ended, reason 2 of replay stopped, because their publication had no subscriber for the replay connect timeout, from the start or from the moment the last subscriber went; over cavalry:udp the replay has a subscriber while its publication is connected, from the first status message without the send-setup flag until the connection timeout passes without one (spec/udp.md, The sender), so a replay nobody answers ends after the replay connect timeout from its start, and one whose receiver went after the connection timeout and then the replay connect timeout (spec/client-protocol.md, Liveness and timeouts; ADR 0043)."
doctor = "A replay was started with no subscription on its replay stream id and channel, or the subscriber closed before the replay ended, or, over cavalry:udp, the replay's publication was never connected, no status message without the send-setup flag having arrived from the channel's endpoint, or its receiver went and the connection timeout passed, which publication.connected and publication.disconnected count: add the subscription before the start replay command, or keep it until replay stopped arrives, or check that a driver on the receiving host subscribes on that endpoint and port; the replay ended at the position it had reached and can be started again from there."

[[counter]]
id = 37
name = "replay.failed"
kind = "counter"
scope = "static"
doc = "Replays that ended on a failure, reason 3 of replay stopped: a segment file of the recording could not be read, or a frame in it failed a check, which log_buffer.rejected_frame counts as well; the position in the event is the last frame delivered."
doctor = "A recording's segment file is unreadable or damaged: `cavalry doctor` names the recording when its slot is invalid, and the log directory's disk is the first thing to check; what was delivered up to the position is whole, and a replay from that position fails at the same frame until the file is restored from a backup."

[[counter]]
id = 38
name = "replay.start_failed"
kind = "counter"
scope = "static"
doc = "Start replay commands refused after the driver took them, with error code 21 (a recording id the catalog does not hold as a valid recording), 24 (a recording a truncate recording, purge segments or purge recording is working on), 23 (a position out of range) or 12 (a segment file that could not be opened); a start the registries refuse with code 10 is driver.registry_full's, and a replay log that could not be created is driver.log_create_failed's (spec/client-protocol.md, Commands; ADR 0031)."
doctor = "The error event's message names the recording, the position and the recording's bounds, the file, or the retention command in progress: `cavalry doctor` lists the recordings with their start and stop positions; resolve an instant through the time index before asking for a position; check the log directory's files for a recording whose segment is missing; and send the replay again once the retention command has been answered."

[[counter]]
id = 39
name = "replay.position"
kind = "gauge"
scope = "instance"
doc = "The position of one replay up to which the replayer has written the recording's frames into the replay's log, stored with a release store after each block; it moves no faster than the slowest subscriber's position plus the publication window over cavalry:ipc, or over cavalry:udp the replay publication's sender.position plus the publication window, paced by its sender.limit, which the receivers' status messages raise, and not at all with no subscriber or while the publication is not connected (spec/client-protocol.md, Commands; spec/udp.md, The sender; ADR 0043); key: replay session id (i64), little-endian; label text: the replay session id, the recording id, the replay publication's session id and its stream id in decimal, space-separated."
doctor = "A replay.position that does not move while the replay has a subscriber is a subscriber that stopped polling: over cavalry:ipc compare the subscription.position counters of the replay stream; over cavalry:udp compare the replay publication's sender.position and sender.limit, keyed by its session id and stream id, a sender position at its limit being a receiver whose status messages stopped raising the window, its subscriber on the receiving host having stopped polling, and a sender position below its limit being the sender not sending, which sender.send_failed and sender.short_sends count; one with no subscriber, or over cavalry:udp whose publication is not connected, waits, and ends with reason 2 after the replay connect timeout."

# The state machines (CLAUDE.md, invariant 4): the counters file's metadata record, the
# recording catalog's descriptor, the driver's view of a recording and of a replay. A catalog slot
# goes from empty to valid in every start whose slot the recorder took: one that goes
# live (recording.started), one whose files then fail (recording.start_failed) and one
# the counters file then refuses (driver.registry_full), so empty to valid is listed
# once for each.

[[state_machine]]
name = "counters_record"
states = ["unused", "allocated", "reclaimed"]

[[transition]]
machine = "counters_record"
from = "unused"
to = "allocated"
counter = "counters.allocations"

[[transition]]
machine = "counters_record"
from = "reclaimed"
to = "allocated"
counter = "counters.allocations"

[[transition]]
machine = "counters_record"
from = "allocated"
to = "reclaimed"
counter = "counters.freed"

[[state_machine]]
name = "catalog_slot"
states = ["empty", "valid", "invalid", "deleted"]

[[transition]]
machine = "catalog_slot"
from = "empty"
to = "valid"
counter = "recording.started"

[[transition]]
machine = "catalog_slot"
from = "empty"
to = "valid"
counter = "recording.start_failed"

[[transition]]
machine = "catalog_slot"
from = "empty"
to = "valid"
counter = "driver.registry_full"

[[transition]]
machine = "catalog_slot"
from = "empty"
to = "invalid"
counter = "recording.invalidated"

[[transition]]
machine = "catalog_slot"
from = "valid"
to = "invalid"
counter = "recording.invalidated"

[[transition]]
machine = "catalog_slot"
from = "deleted"
to = "invalid"
counter = "recording.invalidated"

[[state_machine]]
name = "recording"
states = ["starting", "live", "stopped", "failed"]

[[transition]]
machine = "recording"
from = "starting"
to = "live"
counter = "recording.started"

[[transition]]
machine = "recording"
from = "starting"
to = "failed"
counter = "recording.start_failed"

[[transition]]
machine = "recording"
from = "starting"
to = "failed"
counter = "recording.catalog_full"

[[transition]]
machine = "recording"
from = "starting"
to = "failed"
counter = "driver.registry_full"

[[transition]]
machine = "recording"
from = "live"
to = "stopped"
counter = "recording.stopped"

[[transition]]
machine = "recording"
from = "live"
to = "stopped"
counter = "recording.write_failed"

[[transition]]
machine = "recording"
from = "live"
to = "stopped"
counter = "log_buffer.rejected_frame"

[[transition]]
machine = "recording"
from = "failed"
to = "stopped"
counter = "recording.stopped"

[[state_machine]]
name = "replay"
states = ["starting", "live", "stopped", "failed"]

[[transition]]
machine = "replay"
from = "starting"
to = "live"
counter = "replay.started"

[[transition]]
machine = "replay"
from = "starting"
to = "failed"
counter = "replay.start_failed"

[[transition]]
machine = "replay"
from = "starting"
to = "failed"
counter = "driver.registry_full"

[[transition]]
machine = "replay"
from = "starting"
to = "failed"
counter = "driver.log_create_failed"

[[transition]]
machine = "replay"
from = "live"
to = "stopped"
counter = "replay.stopped"

[[transition]]
machine = "replay"
from = "live"
to = "stopped"
counter = "replay.ended"

[[transition]]
machine = "replay"
from = "live"
to = "stopped"
counter = "replay.not_connected"

[[transition]]
machine = "replay"
from = "live"
to = "stopped"
counter = "replay.failed"

[[transition]]
machine = "replay"
from = "live"
to = "stopped"
counter = "log_buffer.rejected_frame"

[[counter]]
id = 40
name = "recording.truncated"
kind = "counter"
scope = "static"
doc = "Stopped recordings truncated to a position by `truncate recording`: the segment files past the position removed, the one holding it cut, the time index shortened and the stop written again (spec/client-protocol.md, Commands; ADR 0031)."
doctor = ""

[[counter]]
id = 41
name = "recording.segments_purged"
kind = "counter"
scope = "static"
doc = "Segment files removed by `purge segments`, one per file as the replayer removes it, once the recording's retained position was written past them, so the counter reads a purge's progress while it runs (spec/durable-log.md, The driver; ADR 0031; card 177)."
doctor = ""

[[counter]]
id = 42
name = "recording.deleted"
kind = "counter"
scope = "static"
doc = "Stopped recordings deleted by `purge recording`: the slot's state written as 3, then the segment files and the time index removed; the slot stays, so the id never names another recording (ADR 0024, ADR 0031)."
doctor = ""

[[counter]]
id = 43
name = "recording.retention_failed"
kind = "counter"
scope = "static"
doc = "Retention commands the files refused with error code 12: a segment file the replayer could not open or read for a truncate's frame check before the catalog write, or a file it could not remove, cut or extend after it, when the driver ran recovery's rule for the slot at once so that the slot and the files agree (spec/client-protocol.md, Commands; ADR 0031)."
doctor = "The error event's message names the file and what the recording holds now; `cavalry doctor` lists the log directory's filesystem and its free space, and a file the driver could not remove is one to look at by hand (permissions, a filesystem mounted read-only) before the command is sent again."

[[counter]]
id = 44
name = "recording.bytes"
kind = "gauge"
scope = "instance"
doc = "The bytes one live recording's segment files take on disk, the segment file length times the files present, kept by the recorder at each roll and stored with a release store; key and label as recording.position; freed with it after the stop, after which `cavalry doctor` computes a stopped recording's bytes from its descriptor (ADR 0031)."
doctor = "A recording whose bytes are over half the log directory's filesystem is the one `cavalry doctor` names for a `purge segments`; the free-space check names the segment that would free the most."

[[counter]]
id = 45
name = "sender.bytes_sent"
kind = "counter"
scope = "static"
doc = "Bytes of data and padding frames the sender put on the wire for every cavalry:udp publication, headers included (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 46
name = "sender.frames_sent"
kind = "counter"
scope = "static"
doc = "Data and padding frames the sender put on the wire; a padding frame counts whether or not its header went out (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 47
name = "sender.setups_sent"
kind = "counter"
scope = "static"
doc = "Setup frames sent: one every setup interval until a publication's first status message without the send-setup flag, and one for each status message with it (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 48
name = "sender.heartbeats_sent"
kind = "counter"
scope = "static"
doc = "Heartbeats sent: one after each heartbeat interval without a data frame, once a publication has its first status message (spec/udp.md, Heartbeat)."
doctor = ""

[[counter]]
id = 49
name = "sender.retransmits_sent"
kind = "counter"
scope = "static"
doc = "NAKs answered with the frames of the range they name, from the publication's own term (spec/udp.md, The sender)."
doctor = "Retransmits are loss made good: a steady count under load is the network dropping datagrams; compare receiver.gaps_detected on the receiving host and look at the link and the socket buffers."

[[counter]]
id = 50
name = "sender.retransmitted_bytes"
kind = "counter"
scope = "static"
doc = "Bytes of frames sent again in answer to NAKs."
doctor = ""

[[counter]]
id = 51
name = "sender.retransmit_overflow"
kind = "counter"
scope = "static"
doc = "NAKs dropped because a retransmit for another range was outstanding: one retransmit at a time, kept for the retransmit linger after it (spec/udp.md, The sender)."
doctor = "A receiver with gaps in more than one range at once is losing more than one retransmit can mend: the recovery stall this explains ends when the receiver's next NAK, after its retry delay, is answered; a count that keeps rising is a lossy link."

[[counter]]
id = 52
name = "sender.short_sends"
kind = "counter"
scope = "static"
doc = "Datagrams the socket took only part of; the sender position stays at the datagram's first frame and the burst is sent again on the next cycle."
doctor = "The socket's send buffer is smaller than a burst: channel.socket_sndbuf says what the host gave, the operating system's default for a new UDP socket, since the driver sets none; raise that default, net.core.wmem_default on Linux (wmem_max caps a buffer a socket asks for, and does not move this one), then remove the channel's publications, wait the linger and add them again, or send fewer bytes per cycle."

[[counter]]
id = 53
name = "sender.send_failed"
kind = "counter"
scope = "static"
doc = "Sends the operating system refused, EAGAIN, ENOBUFS, EINTR and ECONNREFUSED among them, on a send endpoint, counted and retried on the next cycle, and on a receive endpoint, where the receiver's status messages, NAKs and RTT answers are sent once each; no failure on a live socket errors the endpoint (spec/udp.md, The receiver)."
doctor = "ECONNREFUSED is the normal case for a publisher started before its subscriber or whose subscriber's driver restarted; a count rising while a receiver is live is a send buffer the host capped or a link that is down."

[[counter]]
id = 54
name = "sender.flow_control_limited"
kind = "counter"
scope = "static"
doc = "Times a publication with a frame to send found its sender limit reached: the receiver's window is full, counted once on entry into that state (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 55
name = "sender.naks_received"
kind = "counter"
scope = "static"
doc = "NAKs that arrived at a send endpoint for a publication it carries."
doctor = ""

[[counter]]
id = 56
name = "sender.naks_ignored"
kind = "counter"
scope = "static"
doc = "NAKs dropped: one whose position lies outside the resend window, from the sender position less half a term and the longest message up to the sender position, or one whose term offset is not below the publication's own term length or whose range runs past it, the term a replay's publication keeps from its recording (spec/udp.md, The sender; ADR 0043)."
doctor = "A receiver asking for frames the sender no longer holds has fallen more than half a term behind: the receiving host is too slow for the stream, or was away longer than the link can bridge; its image times out and a new one starts from the setup. A receiver naming an offset past the publication's term is reading another stream's term on the same session and stream, or a stale image: its driver's receiver.dropped_* counters say which."

[[counter]]
id = 57
name = "sender.status_messages_received"
kind = "counter"
scope = "static"
doc = "Status messages that arrived at a send endpoint for a publication it carries, with or without the send-setup flag."
doctor = ""

[[counter]]
id = 58
name = "sender.status_messages_rejected"
kind = "counter"
scope = "static"
doc = "Status messages ignored: one without the send-setup flag whose consumption position lies outside the window around the sender position, one whose consumption term offset the publication's own term does not hold, which a replay's publication keeps from its recording (ADR 0043), or one with the flag that asks a publication at its end of stream for a setup (spec/udp.md, The sender)."
doctor = "A receiver reporting a position the sender cannot place is a receiver of another stream's term ids on the same session and stream, or a stale image: its driver's receiver.dropped_* counters say which."

[[counter]]
id = 59
name = "sender.rtt_replies_sent"
kind = "counter"
scope = "static"
doc = "RTT measurements with the reply flag answered: the same frame without the flag, the echo timestamp and the receiver id unchanged (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 60
name = "sender.position"
kind = "gauge"
scope = "instance"
doc = "The sender position of one cavalry:udp publication: the next byte the sender puts on the wire, stored by the sender with a release store after each burst; key as publication.position; label text: publication.position's three and the endpoint's registration id in decimal, space-separated, so that doctor names the endpoint."
doctor = "A sender.position that does not move while publication.position does is a publication whose receiver window is full (sender.limit) or whose endpoint cannot send (sender.send_failed, sender.short_sends)."

[[counter]]
id = 61
name = "sender.limit"
kind = "gauge"
scope = "instance"
doc = "The sender limit of one cavalry:udp publication: the consumption position of the last accepted status message plus its receiver window length, never lowered; key and label as sender.position."
doctor = "A sender.limit that stays at 0 is a publication no receiver has answered: see sender.setups_sent; one that stops rising while sender.position reaches it is a receiver whose subscriber is slow."

[[counter]]
id = 62
name = "publication.connected"
kind = "counter"
scope = "static"
doc = "cavalry:udp publications whose first status message without the send-setup flag arrived: the publication's limit rises to the sender position plus the publication window from here (spec/udp.md, The sender)."
doctor = ""

[[counter]]
id = 63
name = "publication.disconnected"
kind = "counter"
scope = "static"
doc = "cavalry:udp publications that passed the connection timeout without a status message: the limit falls to the sender position and the publisher reads not connected until the next one (spec/udp.md, The sender)."
doctor = "A receiver that stopped answering: its driver stopped, its host went away, or the link dropped its status messages; sender.setups_sent does not rise for a connected publication, so the receiver's own counters say what happened."

[[counter]]
id = 64
name = "channel.opened"
kind = "counter"
scope = "static"
doc = "Endpoints whose socket was opened, bound and connected on the control plane as the command was handled: initializing to active (spec/udp.md, The receiver)."
doctor = ""

[[counter]]
id = 65
name = "channel.closed"
kind = "counter"
scope = "static"
doc = "Endpoints closed once their last publication's linger ended or their last subscription and image went: active to closing, the socket closed and the five counters freed after the reuse timeout (spec/udp.md, The receiver)."
doctor = ""

[[counter]]
id = 66
name = "channel.status"
kind = "gauge"
scope = "instance"
doc = "One endpoint's state, the channel status indicator a client reads: 0 initializing, 1 active, 2 closing, -1 errored, which this version never stores; key: the endpoint's registration id (i64), the correlation id of the command that opened it, little-endian; label text: the resolved channel."
doctor = "A client whose channel status indicator reads 2 holds an endpoint that is closing: its publications ended; add the publication again to open a new one."

[[counter]]
id = 67
name = "channel.socket_rcvbuf"
kind = "gauge"
scope = "instance"
doc = "The receive buffer length one endpoint's socket holds, read back after the endpoint was opened; key and label as channel.status."
doctor = "Below what was asked, 131072 bytes, is a host that capped the ask: raise net.core.rmem_max on Linux, kern.ipc.maxsockbuf on macOS, then close and open the endpoint again. On Linux the socket reads back twice what was set, so a host that granted the ask reads back 262144 and doctor's line there is that."

[[counter]]
id = 68
name = "channel.socket_sndbuf"
kind = "gauge"
scope = "instance"
doc = "The send buffer length one endpoint's socket holds, the operating system's, read back after the endpoint was opened; key and label as channel.status."
doctor = "Below one datagram of the MTU, Aeron's rule, or on Linux below a burst, the 16 datagrams one sendmmsg hands the socket, is a host that lowered the operating system's default send buffer for a new UDP socket, which the driver leaves as it is: raise net.core.wmem_default on Linux (wmem_max caps a buffer a socket asks for, and the driver asks for none), net.inet.udp.maxdgram on macOS, then close and open the endpoint again; sender.send_failed and sender.short_sends count the cost until then."

[[counter]]
id = 69
name = "channel.images"
kind = "gauge"
scope = "instance"
doc = "How many images one receive endpoint carries; 0 on a send endpoint; key and label as channel.status."
doctor = ""

[[counter]]
id = 70
name = "channel.publications"
kind = "gauge"
scope = "instance"
doc = "How many publications one send endpoint carries; 0 on a receive endpoint; the endpoint closes when it reaches 0 and the last linger ends; key and label as channel.status."
doctor = ""

[[counter]]
id = 71
name = "receiver.receive_failed"
kind = "counter"
scope = "static"
doc = "Receives the operating system refused on a send or a receive endpoint's socket, EAGAIN aside, counted and the poll retried; no failure on a live socket errors the endpoint (spec/udp.md, The receiver)."
doctor = "On a send endpoint whose publication no receiver has answered, this is the port unreachable the kernel reports for a port nobody listens on, one per setup frame and expected beside udp-publication-not-connected; a count that rises while a receiver is live is a socket the host is starving: look at the host's memory pressure and at dmesg."

[[counter]]
id = 72
name = "receiver.bytes_received"
