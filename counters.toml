doctor = ""

# The image's life (spec/udp.md, "The receiver", step 5; ADR 0042): the receiver moves
# it to live when the conductor hands the image over and to ended, timed out or
# unsubscribed when it retires it; the conductor moves it to removed when it has
# unlinked the log.

[[state_machine]]
name = "image"
states = ["pending", "live", "ended", "timed_out", "unsubscribed", "removed"]

[[transition]]
machine = "image"
from = "pending"
to = "live"
counter = "image.created"

[[transition]]
machine = "image"
from = "live"
to = "ended"
counter = "image.ended"

[[transition]]
machine = "image"
from = "live"
to = "timed_out"
counter = "image.timed_out"

[[transition]]
machine = "image"
from = "live"
to = "unsubscribed"
counter = "image.unsubscribed"

[[transition]]
machine = "image"
from = "ended"
to = "removed"
counter = "image.removed"

[[transition]]
machine = "image"
from = "timed_out"
to = "removed"
counter = "image.removed"

[[transition]]
machine = "image"
from = "unsubscribed"
to = "removed"
counter = "image.removed"

# The publication's connection over UDP and the endpoint's life (spec/udp.md, "The
# sender" and "The receiver"; ADR 0040, ADR 0041). The sender moves the connection's
# counters; the conductor moves the endpoint's.

