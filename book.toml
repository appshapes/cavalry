# The mdBook that `just docs` builds from docs/ (CLAUDE.md, invariant 6; ADR 0006). The
# output goes under target/, with the rest of the build products. `create-missing` is off
# so that a page listed in docs/SUMMARY.md but absent from disk fails the build instead
# of being created as an empty stub.
[book]
title = "Cavalry"
description = "A brokerless, low-latency message transport with a durable log and Raft replication"
authors = ["AppShapes"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/appshapes/cavalry"
edit-url-template = "https://github.com/appshapes/cavalry/edit/master/docs/{path}"

# One search document for each page, not for each heading of a page (ADR 0120). The
# search index is then 7.3 MB where it was 9.9 MB, close to the 10 MB at which mdBook
# warns that the index is very large, and `just docs` denies a warning.
[output.html.search]
heading-split-level = 1
