# The mdBook that `just docs` builds from docs/ (CLAUDE.md, invariant 6; ADR 0006). The
# output goes under target/, with the rest of the build products. `create-missing` is off
# so that a page listed in docs/SUMMARY.md but absent from disk fails the build instead
# of being created as an empty stub.
[book]
title = "Cavalry"
description = "A brokerless, low-latency message transport with a durable log and Raft replication"
authors = ["AppShapes"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/appshapes/cavalry"
edit-url-template = "https://github.com/appshapes/cavalry/edit/master/{path}"

# The decisions' pages below docs/reference/decisions.md, made at every build from the
# decisions themselves: each decision's number, title and Decision section, with a
# link to its page (ADR 0165). Nothing of them is in the repository.
[preprocessor.decisions-index]
command = "python3 scripts/decisions-index.py"

# One search document for each page, not for each heading of a page (ADR 0120).
[output.html.search]
heading-split-level = 1

# The decisions' own pages are left out of the search, and the generated pages above
# are how the search finds a decision (ADR 0165): with them in, the index was 24 KB
# under the 10 MB at which mdBook warns that it is very large, and `just docs` denies
# a warning. `scripts/decisions-index.py --check`, which `just docs` runs on the built
# book, fails when a decision's entry on a generated page does not read as its own
# page's Decision section does, or one of these pages is back in the index, and holds
# the index's file to an early bound well under the warning.
[output.html.search.chapter]
"decisions" = { enable = false }
