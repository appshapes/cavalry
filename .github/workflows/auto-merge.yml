# Arms a merge when, and only when, the reviewer agent approved the CURRENT head of a pull
# request labelled `auto-merge` (ADR 0004). It does not merge: `--auto` hands the pull request
# to GitHub, which merges it when the branch protection's required checks, `gates (linux)`
# and `gates (macos)`, pass. The protection rule is what makes "auto" mean "when green"
# instead of "now".
#
# The merging identity is GH_ACTIONS_TOKEN, the owner's personal access token, and the
# owner is a repository admin whom the rule lets bypass. So the wait does not rest on the
# rule REFUSING this merger; it rests on `gh pr merge --auto` choosing to wait for the
# required checks anyway, which it does, and on the fallback below being guarded. Brigade
# runs the same shape on the same kind of token.
#
# What a moved head does to an approval. An approval is of one commit: the `commit_id`
# GitHub records on the review, the head its pull request object had when the review was
# submitted. The `if:` below pins the merge to that commit, and `--match-head-commit` has
# GitHub refuse the merge unless the branch is still at it when the merge happens, so a
# push that crosses an approval never lands under it. GitHub refuses with "Head branch is
# out of date" (or "was modified"), and the refusal is right: the new head has no approval
# of its own. Two cases produce it, and the step below tells them apart by whether GitHub
# raised any run for the branch's tip, polling for a minute:
#   * a push after the approval that GitHub processed: the tip has its `ci` run and, for a
#     person's push, its `dispatch review` run, so the loop reviews it and the next approval
#     arms the next merge; a fixer's push has its `ci` run held, and the fixer's own run
#     asks for the review when it ends, or fails loud. The step ends with a notice and
#     exit 0: a failure mail here would be noise.
#   * a push GitHub never processed: the pull request object still names the approved
#     commit, no run exists for the tip, and nothing in the loop reviews the tip until a
#     push moves the object. The step ends with an error naming both commits and what to
#     push. Pull request 106 on 2026-11-04 (run 41820298847) is the case: the fixer's push
#     of 6a42562 was complete by 11:12:14, yet the pull request object named 203370b until
#     a person's push at 11:24 and no run was ever raised for 6a42562. The fixer's "Verify
#     the fix landed" read the object and called the push a body edit; the dispatcher took
#     203370b from the `labeled` payload; the reviewer checked out 203370b, read 6a42562
#     from the clone, and its approval was recorded against 203370b; both merge calls were
#     refused and the job failed with nothing in its output naming the cause. No verifier
#     in the loop could have refused that review: every one reads the pull request object,
#     and the review's `commit_id` comes from the same object. This step reads the git ref.
#
# The last sweep of the held runs. At the merge GitHub deletes the branch and ends every
# run still held on it as a failure, with a mail (claude.yml, "Delete the runs held on the
# heads the fixer left behind", which says what was measured and why the sweep deletes a
# held run rather than approving and cancelling it: the approval queues the run into
# ci.yml's concurrency group, which cancels the head's live run, so that sweep had to
# stop while one was live, which at the merge is usual; a delete queues nothing). This
# job is the loop's last before that deletion, so it makes the same sweep right before
# the merge: what a failed fixer job or a refused delete left held is deleted here. The
# sweep sits in the merge step, after the moved-head check, because it needs the tip that
# check read and must never run on a head the approval does not cover; it must not stop
# the merge either, so every call in it tolerates a failure with a warning that names the
# next step, rather than a step of its own with `continue-on-error`, which would have to
# read the tip and make the moved-head check a second time.
#
# What disarms the merge. GitHub's auto-merge, once armed, survives a push by a person
# with write access, and the branch protection requires no review, so an armed merge
# would land the pushed head, which nobody reviewed, the moment its checks passed (pull
# request 118 on 2026-11-05: disarmed by hand before a merge of master was pushed).
# Three things move a pull request past its approval without a new one, and each
# disarms the merge from the token-holding side: a push by a person, in
# dispatch-review.yml, which runs on every such push before it dispatches the review of
# the new head; a push by the fixer, whatever started it (a changes-requested review, an
# `@claude` comment or review), in claude.yml's last job, before it approves the held
# `ci` run of the pushed head, which is the only way that head's checks can pass; and a
# review that requests changes on the current head, in the `disarm` job below, so that
# the approved head does not land under an open request; and the `auto-merge` job arms
# nothing while such a request is open on the tip, so the order of the request and the
# approval does not matter. The reviewer's request or a collaborator's counts; a
# stranger's does not move a merge: the reviewer is the App's login `claude[bot]`,
# matched exactly here and in the jobs that read its verdicts, since a login cannot
# hold a bracket and a prefix match let any account named claude-something arm or
# disarm a merge on a public repository (the review of pull request 134 found it in
# the arming clause, which had it from the start). Each disarm leaves a head the reviewer approved
# armed, on its latest verdict. The reviewer's approval of the new head arms the merge
# again through `auto-merge` above, pinned to that head, so a person pushes a merge of
# master freely and disarms nothing by hand. GitHub would do the disarming itself with
# a required approving review that a push dismisses; that rule brings "require a pull
# request before merging" with it, which closes the direct commit to master the working
# rules give developers unless the rule exempts admins, and whether an auto-merge under
# the admin token honours it is unmeasured, so the three jobs are the mechanism until
# both are known.
name: auto merge

on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge:
    # The commit_id clause pins the approval to the CURRENT head: with the fixer pushing to
    # pull request branches, an approval from a reviewer session that started on an older
    # head must never arm a merge for commits it never reviewed. The label clause is the
    # policy switch: a person sets it on the issue, the writer copies it to the pull request,
    # and Dependabot sets it on its own pull requests (.github/dependabot.yml).
    if: |
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'claude[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 4          # a few deletes, a few API calls, the reviews and a one-minute poll on a refusal; not a p90, a floor
    # The job's own GITHUB_TOKEN does nothing here: the merge authenticates with
    # GH_ACTIONS_TOKEN below. Declaring an empty block rather than inheriting the default
    # is the point.
    permissions: {}
    steps:
      # --squash: the commit on master takes its subject from the pull request title and
      # its body from the pull request body, because the repository is configured with
      # squash_merge_commit_title=PR_TITLE and squash_merge_commit_message=PR_BODY (ADR
      # 0004). GitHub's defaults would use the single commit's own message on a one-commit
      # pull request and the review record would hold only by luck.
      #
      # The `||` fallback is the COMMON path, not defensive noise: `--auto` enables GitHub's
      # auto-merge while a required check is pending and merges at once when the pull
      # request is already clean, which here it usually is, since CI finishes long before a
      # reviewer session does; on some already-mergeable states the first call errors
      # ("Pull request is in clean status"), and the fallback merges then. The fallback is
      # GUARDED by `gh pr checks --required`: the token is an admin's and bypasses the rule,
      # so a bare merge would land past the required checks on ANY `--auto` error. The
      # guard costs nothing on the already-green path and refuses every other.
      #
      # The subject and body are passed explicitly rather than left to the repository
      # setting, for one reason: the Blacksmith Codesmith app appends an HTML footer to every
      # pull request body (seen on pull request 2), and a squash that took the body verbatim
      # would carry that footer into the commit on master. The footer sits between two
      # marker comments; everything between them is dropped, nothing else is touched.
      #
      # The branch's tip is read from the git ref before the merge and again after a
      # refusal (`read_tip`, which ends with a notice when the branch is gone because the
      # pull request was merged or closed by hand meanwhile), and `explain_moved_head`
      # says what the refusal means (the header above): the notice or the error, with the
      # approved commit, the tip and the pull request object's head in its output, so
      # that the run names its cause. Every other ending names the next command to run.
      - name: Merge when green
        env:
          # The owner's token. This job runs NO agent, which is the only reason the token may
          # appear in it (ADR 0004).
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          APPROVED: ${{ github.event.review.commit_id }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The branch's tip, or the ending when the branch is gone. Exits then.
          read_tip() {
            local state
            if ! tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha' 2>/dev/null) || [ -z "$tip" ]; then
              state=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "unread")
              case "$state" in
                MERGED|CLOSED) echo "::notice::#$PR is $state and its branch $BRANCH is gone; nothing to do"; exit 0 ;;
                *) echo "::error::the branch $BRANCH of #$PR (state $state) cannot be read: gh api repos/$REPO/git/ref/heads/$BRANCH failed. Read the run's log, then merge by hand: gh pr merge $PR --squash --match-head-commit $APPROVED"; exit 1 ;;
              esac
            fi
          }
          # Why the merge was refused, when the branch is not at the approved commit. Exits,
          # unless the branch is still at it, which is not this cause: then it returns.
          explain_moved_head() {
            local object_head runs dispatched deadline
            if [ "$tip" = "$APPROVED" ]; then
              echo "the branch $BRANCH is still at the approved $APPROVED, so the refusal is not a moved head"
              return 0
            fi
            object_head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/dev/null || echo "unread")
            echo "the approval is of $APPROVED; the branch $BRANCH is at $tip; the pull request object names $object_head"
            deadline=$((SECONDS + 60))
            while :; do
              runs=$(gh api -X GET "repos/$REPO/actions/runs" -f "head_sha=$tip" -F per_page=20 \
                --jq '[.workflow_runs[] | "\(.name) \(.id) \(.status)/\(.conclusion // "")"] | join(", ")' 2>/dev/null || true)
              [ -n "$runs" ] && break
              [ "$SECONDS" -ge "$deadline" ] && break
              sleep 10
            done
            if [ -n "$runs" ]; then
              dispatched=$(gh api -X GET "repos/$REPO/actions/workflows/dispatch-review.yml/runs" -f "head_sha=$tip" -F per_page=10 \
                --jq '[.workflow_runs[] | select(.conclusion != "skipped") | .id] | join(" ")' 2>/dev/null || true)
              if [ -n "$dispatched" ]; then
                echo "::notice::No merge: a push moved #$PR from the approved $APPROVED to $tip, which has no approval of its own. GitHub raised runs for $tip ($runs), its review is dispatched (run $dispatched), and that review's approval arms the next merge; nothing to do."
              else
                echo "::notice::No merge: a push moved #$PR from the approved $APPROVED to $tip, which has no approval of its own. GitHub raised runs for $tip ($runs) and no dispatch review run yet: a fixer's push, whose claude run approves its held run and asks for its review when it ends, or fails loud (claude.yml, approve-fixer-runs); nothing to do here."
              fi
              exit 0
            fi
            echo "::error::No merge, and nothing in the loop reviews the branch's tip: #$PR moved from the approved $APPROVED to $tip, but GitHub raised no run for $tip in 60 s and the pull request object still names $object_head, so every verifier reads the old head (auto-merge.yml's header; pull request 106 on 2026-11-04). Push a commit to the branch, a merge of master or the next change: the synchronize it raises moves the object and starts the review of the tip (docs/how-to/ask-the-agent.md, \"When it does not work\")."
            exit 1
          }
          # The last sweep of the runs held on superseded heads of the branch (the header;
          # claude.yml, "Delete the runs held on the heads the fixer left behind", the same
          # call, measured there). This repository's runs only, since a fork's branch can
          # share the name. A delete never queues the run, so nothing at the tip, live or
          # not, is touched. No call here may stop the merge: each failure is a warning and
          # the sweep goes on.
          sweep_held_runs() {
            local held count deleted id sha
            held=$(gh api -X GET "repos/$REPO/actions/runs" -f "branch=$BRANCH" -f event=pull_request -f status=action_required -F per_page=100 \
              --jq ".workflow_runs[] | select((.head_repository.full_name // \"\") == \"$REPO\" and .head_sha != \"$tip\") | \"\(.id) \(.head_sha)\"") \
              || { echo "::warning::the held runs of $BRANCH could not be listed (the line above); nothing swept, and the merge goes on"; return 0; }
            count=$(printf '%s\n' "$held" | grep -c . || true)
            if [ "$count" -eq 0 ]; then
              echo "no run is held on a superseded head of $BRANCH"
              return 0
            fi
            deleted=0
            while read -r id sha; do
              [ -n "$id" ] || continue
              if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null; then
                echo "deleted run $id, held on the superseded head $sha"
                deleted=$((deleted + 1))
              else
                echo "::warning::run $id, held on the superseded head $sha, refused the delete (the line above) and is left held; it ends as a failure at the merge unless it is deleted on the Actions tab first"
              fi
            done <<< "$held"
            echo "superseded held runs on $BRANCH: $count, deleted $deleted"
          }
          # An open request for changes on the tip, from the reviewer or a collaborator,
          # outranks an approval that a session which started earlier submits after it:
          # the merge is not armed under it (the header, "What disarms the merge"). The
          # latest verdict per account counts, so an account that asked for changes and
          # then approved has approved; every page, oldest first. Exits with a notice
          # when one is open, and with a notice when the reviews cannot be read, since
          # the question is open then too; returns otherwise. Called right before the
          # arm, so that the window between the check and the arm is the one call.
          refuse_open_request() {
            local verdicts open
            if ! verdicts=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq ".[] | select(.commit_id == \"$tip\" and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\") and ((.user.login // \"\") == \"claude[bot]\" or .author_association == \"OWNER\" or .author_association == \"MEMBER\" or .author_association == \"COLLABORATOR\")) | \"\(.submitted_at) \(.user.login) \(.state)\""); then
              echo "::notice::No merge: the reviews of #$PR could not be listed (the line above), so whether a request for changes is open on $tip is unknown, and the approval does not arm the merge on its own. Add the review label to #$PR: the next approval tries again (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")."
              exit 0
            fi
            open=$(printf '%s\n' "$verdicts" | sort | awk '{last[$2] = $3} END {for (u in last) if (last[u] == "CHANGES_REQUESTED") print u}' | tr '\n' ' ')
            if [ -n "$open" ]; then
              echo "::notice::No merge: ${open}asked for changes on $tip and that request is open, so the approval does not arm the merge. The approval of the head that answers it, or of this one asked for again with the review label once the request is withdrawn, arms it (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")."
              exit 0
            fi
          }
          read_tip
          if [ "$tip" != "$APPROVED" ]; then
            explain_moved_head
          fi
          sweep_held_runs
          subject=$(gh pr view "$PR" --repo "$REPO" --json title --jq '.title')
          body="$RUNNER_TEMP/squash-body.md"
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body' \
            | sed '/<!-- codesmith:footer -->/,/<!-- \/codesmith:footer -->/d' \
            | cat -s > "$body"
          refuse_open_request
          merge() { gh pr merge "$PR" --squash --repo "$REPO" --subject "$subject" --body-file "$body" --match-head-commit "$APPROVED" "$@"; }
          err="$RUNNER_TEMP/merge-auto.err"
          if merge --auto 2>"$err"; then exit 0; fi
          cat "$err" >&2
          if gh pr checks "$PR" --required --repo "$REPO"; then
            err="$RUNNER_TEMP/merge.err"
            if merge 2>"$err"; then exit 0; fi
            cat "$err" >&2
          fi
          if grep -qiE 'out of date|was modified|expected head' "$err"; then
            read_tip
            explain_moved_head
          fi
          echo "::error::GitHub refused the merge of #$PR; gh's reason is above. Next: gh pr checks $PR --required, then gh pr view $PR --json mergeStateStatus (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")"
          exit 1

  # The last of the three in "What disarms the merge" in the header: a review that
  # requests changes on the current head. The merge an earlier approval armed would land
  # that head under the open request; and when the fixer answers it, its push moves the
  # head on, which claude.yml's last job disarms for. The reviewer's request counts and
  # a collaborator's, a person's as much as the agent's; a stranger's review on a public
  # repository moves no merge. The commit pin is the `auto-merge` job's: a request
  # against an older head is about a head that is gone, and the approval of the current
  # one stands, and a run that starts after a push moved the branch on says so and
  # leaves the tip's own review to decide. Nothing waits on this job, so a failure
  # here is loud and stops nothing, and every ending that leaves the question open
  # names what to run.
  disarm:
    if: |
      github.event.review.state == 'changes_requested' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      (github.event.review.user.login == 'claude[bot]' ||
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2          # four API calls; not a p90, a floor
    permissions: {}             # the job token does nothing here: GH_ACTIONS_TOKEN armed the merge and disarms it
    steps:
      - name: Disarm the merge the review moved past
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEWED: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          next="Run by hand: gh pr view $PR --json autoMergeRequest, then gh pr merge $PR --disable-auto if it is armed (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")"
          if ! armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // ""'); then
            echo "::error::whether a merge is armed on #$PR could not be read (the line above). $next"
            exit 1
          fi
          if [ -z "$armed" ]; then
            echo "no merge is armed on #$PR; nothing to disarm"
            exit 0
          fi
          # The branch's tip, not the payload's head: this job can start late, after a
          # push moved the branch on, and then the request is about a head that is gone
          # and the tip's own review decides its merge.
          if ! tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha'); then
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "unread")
            case "$state" in
              MERGED|CLOSED) echo "#$PR is $state and its branch $BRANCH is gone; nothing to disarm"; exit 0 ;;
              *) echo "::error::the branch $BRANCH of #$PR (state $state) could not be read (the line above), and the merge armed at $armed may sit under the open request on $REVIEWED. $next"; exit 1 ;;
            esac
          fi
          if [ "$tip" != "$REVIEWED" ]; then
            echo "the branch moved on from the reviewed $REVIEWED to $tip since the review, so the request is about a head that is gone and the review of $tip decides its merge; nothing to disarm"
            exit 0
          fi
          if ! gh pr merge "$PR" --repo "$REPO" --disable-auto; then
            echo "::error::the merge of #$PR, armed at $armed, is still armed on $tip, which a review asked to change: gh pr merge --disable-auto failed (the line above). $next"
            exit 1
          fi
          echo "disarmed the merge of #$PR, armed at $armed: the review requested changes on $tip, and the approval of the head that answers it, or of this one asked for again with the review label once the request is withdrawn, arms it again"
