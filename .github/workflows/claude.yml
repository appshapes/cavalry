# The hub of the agentic loop: every path that starts an agent with WRITE power lands here
# (ADR 0004). Ported from Brigade's claude.yml on 2026-10-10. The lines that matter most while
# reading:
#   * the writer commits with plain `git` on its branch and never runs the `/commit` skill
#     (that sequence stages every untracked file and merges origin mid-run);
#   * writes to .github/workflows/**, .claude/**, spec/** and bench/baseline.json are DENIED,
#     not merely discouraged;
#   * GH_ACTIONS_TOKEN, the owner's personal access token, lives in OTHER JOBS (`open-pr`,
#     `approve-fixer-runs`), never in the job that runs the agent. The agent's Bash children
#     inherit its environment, and a personal access token reaches every repository its
#     account can reach, so the credential is kept out of the JOB rather than out of a step.
#
# Tag mode, deliberately: no `prompt:` input. In tag mode the action takes the issue, comment
# or review body as the prompt, which is what makes a human's `@claude fix X` comment work and
# an issue body a brief. Supplying `prompt:` would switch the action to automation mode and
# change how event context is assembled; do not add one here without re-drilling the loop.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, labeled]
  pull_request:
    types: [opened, labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# One agent at a time per issue or pull request. `cancel-in-progress: false` on purpose,
# unlike the reviewer: a cancelled FIXER can die between `git commit` and `git push`, leaving
# a pull request whose head never moves and whose "Verify the fix landed" step never runs,
# a silent park, the exact failure this file's verifiers exist to make impossible. The fix cap
# already bounds the loop, so queueing is safe.
concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    # Seven clauses. The comment clauses exclude claude-authored comments (a recursion surface
    # the moment `allowed_bots` admits the claude actor). The review clause admits claude*
    # reviews ONLY in changes_requested state: an '@claude' that leaked into an approval must
    # never race a fixer push against an arming auto-merge. A review from a NON-claude login
    # whose body contains '@claude' starts the fixer even in approved state: a human writing
    # '@claude ...' into a review is explicit re-authorisation, and it is how a person restarts
    # the loop after the fix cap has handed off. It cannot race auto-merge, which arms only on
    # a claude* approval. Applying the `claude` label to an EXISTING pull request starts an
    # agent on it; the action's write-access check gates it like every other event.
    #
    # `startsWith(..., 'claude')` presumes the reviewing identity is the Claude GitHub App
    # (claude[bot]), which is installed for every repository of the organisation. Without it
    # the reviewer's `gh pr review` would land as github-actions[bot], no clause here would
    # match, and the fix loop would silently never arm.
    if: |
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.user.login, 'claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.user.login, 'claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && (!startsWith(github.event.review.user.login, 'claude') || github.event.review.state == 'changes_requested')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action == 'assigned' && contains(github.event.issue.labels.*.name, 'claude')) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'claude'))
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Brigade's bound (ADR 0004, Evidence): its longest writer session ran 124 turns in about
    # 14 minutes; 200 turns at its slowest observed pace is about 67 minutes plus setup, so
    # 150 is twice the longest projected job. A hung agent must not burn six hours of the
    # concurrency group. Re-measure when a Cavalry job passes 75 minutes.
    timeout-minutes: 150
    # Published so the `open-pr` job below can act on it. A job output is the ONLY channel
    # between the two jobs, and that is the point: `open-pr` holds the personal access token
    # and this job must not, so nothing crosses the boundary but a branch name.
    outputs:
      branch_name: ${{ steps.claude.outputs.branch_name }}
      agent_outcome: ${{ steps.claude.outcome }}   # 'success' | 'failure' (continue-on-error below): open-pr's tie-breaker when no branch was pushed
      # 'push' | 'body' on a fixer run, from "Verify the fix landed": approve-fixer-runs asks for
      # the review of a body-only fix, which raises no event. Computed from the pull request's
      # state by a step that runs no agent, so nothing the model wrote crosses to that job.
      fix_landed: ${{ steps.verify_fix.outputs.landed }}
    # NOTE what is NOT in this job: `secrets.GH_ACTIONS_TOKEN`. The agent's Bash children
    # inherit this step's environment (no `allowed_non_write_users`, so the action's secret
    # scrub is off, ADR 0004), so the token is kept out of the job entirely. Reachable here, by
    # design and by acceptance: CLAUDE_CODE_OAUTH_TOKEN and this job's own repository-scoped,
    # job-lifetime GITHUB_TOKEN.
    permissions:
      contents: write          # the agent commits and pushes its branch
      pull-requests: write     # comments, labels
      issues: write            # the agent comments on the issue it is working (the close happens in open-pr)
      id-token: write          # claude-code-action's OIDC exchange for the Claude App token
      actions: read            # lets the agent read its own run logs
    steps:
      # The derived fix cap. The reviewer ends a changes-requested body with an '@claude ...'
      # instruction, which lands here through pull_request_review. Each fix cycle is armed by
      # exactly ONE claude* changes-requested review, so counting those reviews IS the attempt
      # counter: nothing to persist, nothing to reset, correct after a re-run. Scoped to
      # claude-authored reviews; a HUMAN's '@claude' review is explicit re-authorisation and
      # bypasses the cap. The hand-off comment is posted once, carries no @-mention, and uses
      # GITHUB_TOKEN precisely because its events never start workflows.
      #
      # The staleness clause: GitHub can deliver the same webhook twice, and the per-PR
      # concurrency group QUEUES rather than cancels, so two runs of this gate for ONE review
      # are possible. A review addresses the head it was written against, so the run proceeds
      # only while the pull request's CURRENT head still equals the review's `commit_id`. The
      # first fixer's push moves the head; a duplicate arriving after it skips as stale. A
      # body-only fix moves no head, so the second test is a claude review newer than this
      # one at the same head: the loop has reviewed that fix already, and that review's own
      # event runs the fixer if it needs to. A duplicate that arrives before that review
      # lands still proceeds, and ends loud, or costs one more review of the same head
      # when its fixer rewrites the already-fixed body; the fix cap bounds it.
      - name: Gate autonomous fix attempts
        id: fix_gate
        if: github.event_name == 'pull_request_review' && startsWith(github.event.review.user.login, 'claude')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
          REVIEW_ID: ${{ github.event.review.id }}
          MAX_ATTEMPTS: 3
        run: |
          set -euo pipefail
          gh_retry() {
            local i out
            for i in 1 2 3; do
              if out=$("$@"); then printf '%s\n' "$out"; return 0; fi
              echo "attempt $i failed: $*" >&2
              [ "$i" -lt 3 ] && sleep 5
            done
            return 1
          }
          head_now=$(gh_retry gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$head_now" != "$REVIEW_COMMIT_ID" ]; then
            echo "stale review: a fix already landed (review addressed $REVIEW_COMMIT_ID, head is now $head_now); skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newer=$(gh_retry gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select((.user.login // \"\" | startswith(\"claude\")) and .commit_id == \"$REVIEW_COMMIT_ID\" and .id > $REVIEW_ID) | .id")
          if [ -n "$newer" ]; then
            echo "stale review: the loop has reviewed $REVIEW_COMMIT_ID again since review $REVIEW_ID (review $(printf '%s' "$newer" | tr '\n' ' ')); skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The body as the fixer finds it, so that "Verify the fix landed" can tell a fix
          # that was an edit to the body (the review's blocker was in the pull request body,
          # the squash commit's message) from a run that did nothing it could show.
          body=$(gh_retry gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          echo "body_hash=$(printf '%s' "$body" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ids=$(gh_retry gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select((.user.login // "" | startswith("claude")) and .state == "CHANGES_REQUESTED") | .id')
          count=$(printf '%s\n' "$ids" | grep -c . || true)
          if [ "$count" -gt "$MAX_ATTEMPTS" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            if [ "$count" -eq $((MAX_ATTEMPTS + 1)) ]; then
              gh pr comment "$PR_NUMBER" --body "Autonomous fix cap reached: the reviewer has requested changes $count times (cap: $MAX_ATTEMPTS fix cycles). Handing off to a human; no further autonomous fixes will run on this pull request."
            fi
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # This `if:` is repeated on the next five steps rather than split into a second job: a
      # second job would need its own checkout, toolchain, cache and timeout for no gain. It
      # reads "run unless this is a claude review that the fix cap has stopped".
      - name: Checkout
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # the agent diffs against master and reads history for its review record

      # The same toolchain steps as ci.yml, so `just lint` and `just test` work when the agent
      # reaches for them, and the install stays out of the turn budget.
      - name: Install the Rust toolchain
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install just
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install mdbook
        # For `just docs`, which the writer runs before every push (.claude/agents/developer.md).
        # The same pin as ci.yml (ADR 0006); bump both together.
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: mdbook@0.5.4
      - name: Restore the Rust cache
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates     # share ci.yml's cache rather than keying a second one per agent run
          save-if: false

      - name: Code
        id: claude
        if: github.event_name != 'pull_request_review' || !startsWith(github.event.review.user.login, 'claude') || steps.fix_gate.outputs.proceed == 'true'
        # This step's failure is not the job's verdict: the action fails a step whose agent hit
        # --max-turns even after it pushed its branch. The verdicts live downstream: `open-pr`
        # for an issue (a pushed branch becomes a pull request; none, and `agent_outcome`
        # decides between "nothing to change" and "died: leave the issue open"), "Verify the
        # fix landed" for the fixer, and "Fail on an undecided agent failure" for the rest.
        continue-on-error: true
        # The agent's Bash children inherit this step's environment (the scrub is off; see
        # the job's NOTE above), which is the only way a variable reaches a command the
        # agent runs: its allow list matches `just ...`, not `NAME=value just ...`, so the
        # fixer's runs on pull request 84 (41214560013, 41217274690) could not set this one
        # and ran `just lint-docs` over their own commit alone, and said so. CI's range for
        # a pull request is origin/master...HEAD, the whole branch (scripts/lint-docs.py,
        # header); on an issue run the branch starts at master, so the range is the run's
        # own commits. `fetch-depth: 0` above is what makes origin/master a commit here.
        env:
          LINT_DOCS_RANGE: origin/master...HEAD
        # Pinned by SHA like every action here (ADR 0003), and this one matters most: it runs
        # a model with repository write access. Re-resolve the current `v1` when bumping:
        #   gh api repos/anthropics/claude-code-action/git/ref/tags/v1 --jq '.object.sha'
        #   (an annotated tag needs one more hop: gh api .../git/tags/<sha> --jq '.object.sha')
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          # EXACTLY ONE login, explicit, never '*': claude, the Claude GitHub App, the actor of
          # the fixer's own push and of the changes-requested review that arms this job. Pull
          # requests raised by the loop are created with the owner's token, so their actor is a
          # human with write access and they clear the action's default check without touching
          # this list. '*' on a public repository would let ANY GitHub App invoke this agent
          # with a prompt it controls.
          allowed_bots: "claude"
          # NEVER set allowed_non_write_users. The action's default check, write access on the
          # triggering actor, is the single control that keeps a stranger's comment on a PUBLIC
          # repository from becoming a prompt on a runner.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --max-turns is a hard stop on a wandering session. 200 is Brigade's measured bound:
          # 1.5 times its largest observed writer session (124 turns), rounded up. Re-measure
          # when a Cavalry session passes 150. The spend ceiling is the plan behind the OAuth
          # token; there is no second ceiling to set here.
          # Opus 5.5 at xhigh effort (owner, 2026-11-04): the fixer applies named blockers, which
          # needs the effort more than the model, and the account behind the token reached its
          # Fable limit on 2026-11-04 while the implementation sessions still need Fable. Fable 5.1
          # ran this agent from 2026-10-16; the turn and time bounds were measured on Opus.
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 200"
          # Public repository: run logs are world readable. Keep the agent's output out.
          show_full_output: false
          # Lets the agent read its own workflow run logs when a gate fails in CI.
          additional_permissions: |
            actions: read
          settings: |
            {
              "includeCoAuthoredBy": false,
              "permissions": {
                "allow": [
                  "Bash(just:*)",
                  "Bash(cargo:*)",
                  "Bash(git:*)",
                  "Bash(gh:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(sed:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Write(.github/workflows/**)",
                  "Edit(.github/workflows/**)",
                  "Write(.claude/**)",
                  "Edit(.claude/**)",
                  "Write(spec/**)",
                  "Edit(spec/**)",
                  "Write(bench/baseline.json)",
                  "Edit(bench/baseline.json)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }
          # Absent from `allow` on purpose: WebFetch and WebSearch. The writer works from a
          # checkout, `git`, `gh` and the build; nothing in this repository's work needs the
          # web, and a fetch tool is the cheapest exfiltration verb an injected prompt can reach
          # for. `Bash(just:*)` and `Bash(cargo:*)` still execute code (`cargo test` runs test
          # binaries), so this closes a path, not the class; ADR 0004 states the residual.
          #
          # Why each deny exists:
          #   .github/workflows/** : neither the job token nor the Claude App's token can push a
          #                          change there without the `workflows` permission; failing at
          #                          the edit is a better error than failing at the push.
          #   .claude/**           : the agent must not rewrite its own operating instructions.
          #   spec/**              : a wire change is a spec change with an ADR first (CLAUDE.md,
          #                          "Protocol"); the agent asks, a human decides.
          #   bench/baseline.json  : the baseline is what CI diffs a histogram against; an agent
          #                          that rewrites it hides the regression it was asked to fix.
          #   .env                 : local-only credential files, gitignored; the deny is free.
          # A permission pattern matches the command string, not a parsed argv: it is a guard
          # rail, not a boundary. The boundaries are the job's `permissions:` block and the
          # token scopes. The general edit tools (Write, Edit) come from the action's own
          # defaults, which is how this agent edits a Rust file at all.
          # `includeCoAuthoredBy: false`: the commit message is the review record, and a
          # trailer is not evidence. The action still asks the agent to co-author the person
          # who triggered it; `open-pr` drops those lines when it builds the body.

      # The fixer can end green without its fix landing: a narrated-only fix, or a remote
      # rejection. No push means no `synchronize`, no re-review, and a silently parked pull
      # request. Fail loud instead. Two things count as landed: a push, which moves the
      # head, and an edit to the pull request body on the unchanged head, which is the whole
      # fix when the review's only blocker was in the body (the squash commit's message,
      # ADR 0004). Pull request 10 on 2026-10-12 (issue 11) and 84 on 2026-10-31 (run
      # 41216229985) each parked that way, green head and changes requested, until a
      # person added the `review` label. Neither a fixer push nor a body edit raises an
      # event the loop runs on, so `approve-fixer-runs` below asks for the review in both
      # cases, reading `landed`. Anything else that edits the body during the run reads as
      # a fix too and costs one review of the same head, the cheaper mistake.
      - name: Verify the fix landed
        id: verify_fix
        if: ${{ !cancelled() && github.event_name == 'pull_request_review' && startsWith(github.event.review.user.login, 'claude') && steps.fix_gate.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          BODY_HASH_BEFORE: ${{ steps.fix_gate.outputs.body_hash }}
        run: |
          set -euo pipefail
          head_now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$head_now" != "$REVIEWED_SHA" ]; then
            echo "the fix landed as a push: the head moved from $REVIEWED_SHA to $head_now"
            echo "landed=push" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          body_hash=$(printf '%s' "$body" | sha256sum | cut -d' ' -f1)
          if [ "$body_hash" != "$BODY_HASH_BEFORE" ]; then
            echo "::notice::The fix landed as an edit to the pull request body on the unchanged head $head_now; approve-fixer-runs asks for the review of that head"
            echo "landed=body" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Fix session ended without a push landing on the pull request branch (head still at the reviewed SHA $REVIEWED_SHA) and without a change to the pull request body; no re-review will fire"
          exit 1

      # For the paths no verifier decides, a human's `@claude` comment or review, the agent
      # step's own outcome is the verdict; `continue-on-error` must not turn its death green.
      - name: Fail on an undecided agent failure
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' && github.event_name != 'issues' && !(github.event_name == 'pull_request_review' && startsWith(github.event.review.user.login, 'claude')) }}
        run: |
          echo "::error::The agent step failed (its log says why) and no downstream verifier decides this event"
          exit 1

  # A SEPARATE JOB, and the separation is a security boundary rather than tidiness (ADR
  # 0004). The pull request must raise `pull_request: opened` so the reviewer runs, and a
  # GITHUB_TOKEN write raises no workflow events, so this step needs GH_ACTIONS_TOKEN, the
  # owner's personal access token. Putting it in a later JOB means the agent's job never
  # holds it, in any step, and no future `if:` edit can quietly make it reachable. DO NOT
  # collapse these jobs back into the agent's.
  #
  # `needs: agent` also gives the sequencing: a FAILED or SKIPPED agent job skips this one,
  # which the close-the-issue step depends on (a failed run must leave the issue open).
  open-pr:
    needs: agent
    if: github.event_name == 'issues'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5          # a branch lookup, a compare and one `gh pr create`; not a p90, a floor
    permissions:
      issues: write             # ONLY for the close-when-nothing-changed step, which uses GITHUB_TOKEN on purpose
    steps:
      - name: Create the pull request
        id: create_pr
        env:
          # The owner's token: its write DOES raise `pull_request: opened`, which starts the
          # reviewer. The pull request's author is therefore the owner, a human with write
          # access, which is why `allowed_bots` above needs only the one name.
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}     # no checkout here, so gh has no git context to infer it from
          BRANCH: ${{ needs.agent.outputs.branch_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The REMOTE BRANCH, not the action output, decides whether there is anything to open
          # a pull request for: the action reports a branch name even on runs where it pushed
          # nothing. Only a definitive 404 counts as no-changes; a transient API failure must
          # fail loudly, or the close step below would wrongly close the issue over a live
          # branch.
          if [ -z "$BRANCH" ]; then
            # An agent that died at its ceiling may have pushed before the action published its
            # output (the action names its branch `claude/issue-<n>-<stamp>` up front), so look
            # for such a branch before concluding that nothing changed; the newest stamp wins.
            BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq "[.[] | select(.name | startswith(\"claude/issue-${ISSUE_NUMBER}-\")) | .name] | sort | last // empty")
            if [ -z "$BRANCH" ]; then
              echo "No branch name and no claude/issue-${ISSUE_NUMBER}-* branch: the agent pushed nothing, skipping pull request creation."
              echo "pr_created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Recovered branch $BRANCH from the repository: the action published no branch name."
          fi
          if resp=$(gh api "repos/${GITHUB_REPOSITORY}/branches/$BRANCH" 2>&1); then
            :
          elif grep -q "HTTP 404" <<<"$resp"; then
            echo "No pushed branch: the agent made no changes, skipping pull request creation."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::Branch existence check failed (not a 404); leaving the issue open for retry: $resp"
            exit 1
          fi
          # The title is the issue's title, as written: `<card>: <Imperative subject>` when the
          # issue names its Trello card, an imperative subject otherwise (the commit rule in
          # CLAUDE.md and .claude/skills/commit). The squash merge takes its subject from this
          # title because squash_merge_commit_title=PR_TITLE is set on the repository (ADR
          # 0004). No prefix is invented here: a card the issue did not name is not known.
          #
          # The body is the review record, built from the branch's commit messages, because
          # squash_merge_commit_message=PR_BODY makes it the commit message on master. One
          # commit: its body as written. Several: each subject as a heading over its body.
          # Co-author trailers are dropped (the action asks the agent to add one for the
          # person who triggered it), and `Closes #N` is appended once, unless the agent
          # already wrote it (pull request 2 had it twice).
          compare="repos/${GITHUB_REPOSITORY}/compare/master...${BRANCH}"
          count=$(gh api "$compare" --jq '.commits | length')
          body="$RUNNER_TEMP/pr-body.md"
          if [ "$count" -eq 1 ]; then
            gh api "$compare" --jq '.commits[0].commit.message | split("\n") | .[1:] | join("\n") | ltrimstr("\n")'
          else
            gh api "$compare" --jq '.commits[] | .commit.message | split("\n") as $l | "### \($l[0])\n\n\($l[1:] | join("\n") | ltrimstr("\n"))\n"'
          fi | grep -viE '^Co-authored-by:' | cat -s > "$body"
          if ! grep -qiE "^Closes #${ISSUE_NUMBER}\b" "$body"; then
            printf '\nCloses #%s\n' "$ISSUE_NUMBER" >> "$body"
          fi
          # Labels are copied from the ISSUE, where the policy decision was made: `auto-merge`
          # means the reviewer's approval plus green CI merges it with no human step.
          LABELS=()
          if echo "$ISSUE_LABELS" | jq -e 'map(.name) | index("auto-merge")' >/dev/null 2>&1; then
            LABELS+=(--label auto-merge)
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$body" \
            "${LABELS[@]}"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      # An agent that DIED (max turns, an API error) without pushing is not an agent that had
      # nothing to change. `agent_outcome` tells them apart. GITHUB_TOKEN on purpose: a comment
      # or a close must chain to nothing.
      - name: Leave the issue open when the agent died without a push
        if: steps.create_pr.outputs.pr_created == 'false' && needs.agent.outputs.agent_outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "The agent run ended in failure without pushing a branch ($RUN_URL). Leaving this issue open: re-apply the \`claude\` label to run it again."
          echo "::error::The agent step failed and pushed nothing; issue #$ISSUE_NUMBER left open for a retry"
          exit 1

      # An agent regularly finishes with nothing to change. That run pushes no branch, so no
      # `Closes #N` pull request ever arrives and the issue would sit open until a human closed
      # it. The determination is STRUCTURAL, the agent ran to completion and opened no pull
      # request, so close on that rather than on the wording of its comment.
      - name: Close the issue when the agent had nothing to change
        if: steps.create_pr.outputs.pr_created == 'false' && needs.agent.outputs.agent_outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)
          if [ "$state" = "CLOSED" ]; then
            echo "Issue #$ISSUE_NUMBER is already closed; nothing to do."
            exit 0
          fi
          gh issue close "$ISSUE_NUMBER" \
            --reason completed \
            --comment "The agent finished this run without changes, so there is no pull request to close this issue. Closing automatically; its comment above records what was reviewed. Reopen if the run looks wrong."

  # GitHub holds every run a fixer push raises: `ci` on the new head sits at
  # `action_required` whatever the fork approval policy says (Brigade measured it on
  # 2026-09-17: the push is attributed to github-actions[bot], which no policy value
  # exempts). And it raises no `pull_request_target` run for that push at all, so the
  # dispatcher never starts the review of the fix (pull requests 52 and 53 on 2026-10-26:
  # `ci` held on 063f079 and 75fdba0, no `dispatch review` run on either, while a person's
  # push to the same branches raised both within ten seconds). This job makes the calls a
  # person would make: it deletes the runs held on the heads the fixer pushed before its
  # last (the first step says why a delete), disarms the merge an earlier approval armed
  # when the push moved past it, approves the last head's with
  # `POST .../actions/runs/<id>/approve`, and adds the `review` label, all from the
  # token-holding side of the boundary above: no agent runs here, nothing here reads
  # model output, and GH_ACTIONS_TOKEN stays out of the agent's job exactly as it does
  # for `open-pr`. It runs after the agent job on every pull-request-bound event and is a
  # no-op when the branch has no held run and the head has its dispatch run already,
  # with one exception: a fix that was an edit to the pull request body alone ("Verify
  # the fix landed", `landed=body`) leaves the head where the review found it, its
  # dispatch run already spent, so the label is the only way its review happens.
  # After a failed or cancelled agent job it runs the first two steps alone: a push that
  # run made before it ended is swept and disarmed for, and its held run and its review
  # are a person's, since the fixer's comment says what it did; the approval and the
  # label wait for a run that ended well.
  approve-fixer-runs:
    needs: agent
    if: |
      always() && needs.agent.result != 'skipped' && (
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5          # a few deletes and a two-minute poll at most; not a p90, a floor
    permissions: {}             # the job token does nothing here: the approval authenticates with GH_ACTIONS_TOKEN
    steps:
      # A run held on an earlier head of the same cycle is superseded: the fixer pushes each
      # blocker as it lands, and the pull request's checks are the head's alone. This step
      # DELETES every such run, before the step below approves the head's. Until 2026-11-05
      # it was left held, on the reading that it sat in the Actions tab's waiting list and
      # nothing read it. It did not stay there: the moment the pull request merged and
      # GitHub deleted its branch, every run still held on the branch ended as a FAILURE
      # with zero jobs and the annotation "This run likely failed because of a workflow file
      # issue", and a failure mail went out, within two seconds of the merge. Twenty runs
      # ended that way in the week to 2026-11-04, on pull requests 90, 92, 94, 97, 98, 99,
      # 103, 108, 113 and 114 (run 41881392406, held on pull request 113's b826c22, is one
      # to read), each with a green `ci` run on its final head; the probe for card 210
      # reproduced it on 2026-11-05 (run 41998580734, failed one second after its branch
      # was deleted). A cancelled or deleted run sends no mail.
      #
      # Why a delete and not a cancel. GitHub reports a held run as status `completed` with
      # conclusion `action_required`, so `POST .../cancel` and `.../force-cancel` both
      # answer 409; the way to a cancel is `POST .../approve` and then `.../cancel` retried
      # once a second, which ended a held run cancelled in six seconds with no job created
      # (card 210, run 41998580736). That was this step from 2026-11-05 13:00 until card
      # 217, and it had a window it could not use: the approval queues the run into
      # `ci.yml`'s concurrency group, `ci-<ref>` with cancel-in-progress on a pull request,
      # and the group cancels the run in progress when another queues. Measured on pull
      # request 131 (card 217): with the tip's run 42093799584 queued, approving run
      # 42093707931, held on an older head, put the older run in `pending` and ended the
      # tip's jobs cancelled three seconds later; the sweep's cancel within a second had
      # beaten that reaction on pull request 119, which proved nothing. So the sweep had to
      # stop while a `ci` run at the head was live, which at the merge, with a bench queue,
      # is usual (pull requests 121 to 124 on 2026-11-05, every one), and what it left held
      # failed at the merge as before (pull request 121, run 42011131843, two seconds after
      # the merge). `DELETE .../actions/runs/<id>` has no such window: a held run accepts it
      # (runs 42093756872, 42093707959, 42093756942 and 42093799622 on that probe, each 404
      # after), the run never queues, so the group never sees it, and GitHub has nothing
      # left to fail when the branch goes. What the delete costs is the Actions tab's record
      # of a run that never ran, with zero jobs; the line this step prints names the run and
      # the head it was held on, and the commit stays in the pull request's history.
      #
      # "Superseded" is judged against the branch's tip from the git ref as well as against
      # the pull request object's head, because the object can lag the push (pull request
      # 106, 2026-11-04; auto-merge.yml's header): a run held on the tip is the head's, and
      # the step below approves it. Only this repository's runs are listed: the runs API
      # matches `branch` against the head branch's name, which a fork's pull request can
      # share, and the owner's token must not touch an outsider's run (ADR 0005).
      # auto-merge.yml makes the same sweep right before the merge, the loop's last run
      # before GitHub deletes the branch; what a refused delete leaves held is swept there. This step is NOT allowed to stop the
      # steps after it: it exists to stop noise mail, and the approval and the review label
      # below are the loop's critical path, so every call in it tolerates a failure with a
      # warning that names the next step, and `continue-on-error` is the belt.
      - name: Delete the runs held on the heads the fixer left behind
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! IFS=$'\t' read -r head branch < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.head.sha, .head.ref] | @tsv' 2>/dev/null); then
            echo "#${PR_NUMBER} is not a pull request; nothing to delete"
            exit 0
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || echo "$head")
          # The held runs, from the runs API's own filter for them, so that a long-lived
          # branch's oldest runs are not left on a later page; this repository's only.
          superseded=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f "branch=${branch}" -f event=pull_request -f status=action_required -F per_page=100 \
            --jq ".workflow_runs[] | select((.head_repository.full_name // \"\") == \"${GITHUB_REPOSITORY}\" and .head_sha != \"${head}\" and .head_sha != \"${tip}\") | \"\(.id) \(.head_sha)\"") \
            || { echo "::warning::the held runs of ${branch} could not be listed (the line above); nothing swept, and the approval of the head's run below goes on"; exit 0; }
          count=$(printf '%s\n' "$superseded" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "no run is held on a superseded head of ${branch}"
            exit 0
          fi
          deleted=0
          while read -r id sha; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null; then
              echo "deleted run ${id}, held on the superseded head ${sha}"
              deleted=$((deleted + 1))
            else
              echo "::warning::run ${id}, held on the superseded head ${sha}, refused the delete (the line above) and is left held; the auto merge run sweeps it before the merge, or delete it on the Actions tab"
            fi
          done <<< "$superseded"
          echo "superseded held runs on ${branch}: ${count}, deleted ${deleted}"

      # The fixer's push moved the head past the approval that armed the merge, when one
      # had: GitHub's auto-merge survives the push, and the pushed head's checks pass the
      # moment the step below approves its held `ci` run, so the merge would land a head
      # nobody reviewed (auto-merge.yml's header, "What disarms the merge"). This step
      # disarms it first, whatever started the fixer: a changes-requested review, whose
      # own `auto merge` run disarmed already, or an `@claude` comment or review, whose
      # push raises no event at all. A head that has an approval of its own is left armed:
      # a run that pushed nothing, or a body-only fix, leaves the approved head where it
      # was, and a reviewer may have approved the pushed head before this job ran; the
      # reviewer's approval alone counts, since it alone arms a merge, as its latest
      # verdict on the head, and the check is made again after the disarm, since an
      # approval that crossed it leaves a merge nothing arms again on its own. A failure
      # here stops the job, a failed read included: approving the held run under an
      # armed merge is the one thing this job must not do, so every ending that leaves
      # the question open is an error naming what to run, and the approval and the
      # label are a person's then. Whether the event is a pull request's is read from
      # the event, never from a read's success.
      - name: Disarm the merge the fixer's push moved past
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Empty on an issue's event. Whether this is a pull request is decided from the
          # event, not from whether a read of it succeeded: a failed read stops this job.
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.pull_request.html_url || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PR_URL" ]; then
            echo "#${PR_NUMBER} is an issue, not a pull request; nothing to disarm"
            exit 0
          fi
          next="Run by hand: gh pr view ${PR_NUMBER} --json autoMergeRequest, then gh pr merge ${PR_NUMBER} --disable-auto if it is armed, then approve the held ci run of the branch's tip on the Actions tab and add the review label (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")"
          if ! IFS=$'\t' read -r head branch < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.head.sha, .head.ref] | @tsv'); then
            echo "::error::pull request #${PR_NUMBER} could not be read (the line above), so whether a merge is armed on it is unknown and the held run below is not approved. ${next}"
            exit 1
          fi
          if ! armed=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // ""'); then
            echo "::error::whether a merge is armed on #${PR_NUMBER} could not be read (the line above), so the held run below is not approved. ${next}"
            exit 1
          fi
          if [ -z "$armed" ]; then
            echo "no merge is armed on #${PR_NUMBER}; nothing to disarm"
            exit 0
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || echo "$head")
          # The reviewer's latest verdict on the tip, per account; its approval is what arms a
          # merge. Every page, oldest first, so the newest verdict is read last.
          approved() {
            local verdicts
            if ! verdicts=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq ".[] | select(.commit_id == \"${tip}\" and (.user.login // \"\") == \"claude[bot]\" and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\")) | \"\(.submitted_at) \(.user.login) \(.state)\""); then
              echo "::warning::the reviews of #${PR_NUMBER} could not be listed (the line above); read as no approval of ${tip}"
              return 1
            fi
            printf '%s\n' "$verdicts" | sort | awk '{last[$2] = $3} END {for (u in last) if (last[u] == "APPROVED") found = 1; exit !found}'
          }
          if approved; then
            echo "the branch's tip ${tip} has the reviewer's approval, so the merge armed at ${armed} is its own; nothing to disarm"
            exit 0
          fi
          if ! gh pr merge "$PR_NUMBER" --disable-auto; then
            echo "::error::the merge of #${PR_NUMBER}, armed at ${armed}, is still armed on ${tip}, which nobody reviewed: gh pr merge --disable-auto failed (the line above), and the held run below is not approved. ${next}"
            exit 1
          fi
          echo "disarmed the merge of #${PR_NUMBER}, armed at ${armed}: the fixer's push moved the head to ${tip}, past the approval; on a labelled pull request the review of ${tip} arms it again, and a person arms it otherwise"
          if approved; then
            echo "::warning::the reviewer approved ${tip} while this step was disarming, so the merge that approval armed is gone with the old one, and nothing arms it again on its own. Add the review label to #${PR_NUMBER} once this run ends: the fresh approval arms it (docs/how-to/ask-the-agent.md, \"The pull request is approved but not merged\")"
          fi

      - name: Approve the runs GitHub held on the fixer's push
        if: needs.agent.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null); then
            echo "#${PR_NUMBER} is not a pull request; nothing to approve"
            exit 0
          fi
          # The held runs appear within seconds of the push, which happened before this job
          # started; poll for up to two minutes, approve whatever is held, and stop after one
          # quiet poll once runs exist. Only the head's runs: a run held on an earlier head
          # of the same cycle would test a superseded tree and queue on the single-tenant
          # bench hosts, and the step above has deleted it.
          approved=0; seen=0; quiet=0; deadline=$((SECONDS + 120))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion // "")"')
            held=$(printf '%s\n' "$runs" | awk '$3 == "action_required" {print $1}')
            for id in $held; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null
              echo "approved run ${id} on ${head}"
              approved=$((approved + 1))
            done
            [ -n "$runs" ] && seen=1
            if [ -n "$held" ]; then quiet=0; elif [ "$seen" = 1 ]; then quiet=$((quiet + 1)); fi
            [ "$quiet" -ge 2 ] && break
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 10
          done
          echo "runs on ${head}: $(printf '%s\n' "$runs" | grep -c . || true); approved ${approved}"

      # The owner's token adds the label, so the `labeled` event fires and the dispatcher
      # (dispatch-review.yml) takes the label off and starts the reviewer: the signal a
      # person sends today, sent by the run that pushed. Nothing is sent for a head that
      # has a `dispatch review` run already, which every head a person pushed has, so no
      # head is reviewed twice and a run that pushed nothing sends nothing; the one head
      # reviewed twice on purpose is a body-only fix's, whose fix is in the body the
      # reviewer reads, not in the head, and the reviewer's "Verify a review was
      # submitted" counts only a review newer than its run's start, so the second review
      # of that head is a real verdict or a retry, never the first one read again. A
      # skipped dispatch run is a `labeled` event for
      # another label, not a review, so it does not count. The dispatcher refuses a fork,
      # so a fork head gets no label either.
      - name: Ask for the review of the agent's push
        if: needs.agent.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          FIX_LANDED: ${{ needs.agent.outputs.fix_landed }}
        run: |
          set -euo pipefail
          if ! IFS=$'\t' read -r head head_repo < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.head.sha, .head.repo.full_name] | @tsv' 2>/dev/null); then
            echo "#${PR_NUMBER} is not a pull request; nothing to review"
            exit 0
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "#${PR_NUMBER} is from ${head_repo}; the reviewer does not run on forks (ADR 0005)"
            exit 0
          fi
          if [ "$FIX_LANDED" = "body" ]; then
            gh pr edit "$PR_NUMBER" --add-label review
            echo "added the review label to #${PR_NUMBER}: the fix was an edit to the pull request body on the unchanged head ${head}, which raises no event"
            exit 0
          fi
          dispatched=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/dispatch-review.yml/runs?head_sha=${head}&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion != "skipped")] | length')
          if [ "$dispatched" -gt 0 ]; then
            echo "head ${head} has ${dispatched} dispatch review run(s) already; nothing to do"
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --add-label review
          echo "added the review label to #${PR_NUMBER}: the push to ${head} raised no dispatch review run"
