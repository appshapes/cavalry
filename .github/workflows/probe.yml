# Throwaway, for card 210: on this pull request's own events, pushes one empty commit to
# the branch with the job token, so that the `ci` run GitHub holds on a bot push can be
# measured. Guarded to one push: it never runs for the bot's own push. Deleted with the branch.
name: probe
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  push:
    if: github.head_ref == '210-probe-held-run' && github.actor != 'github-actions[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - run: |
          if git log -1 --format=%s | grep -q '^210: Probe push'; then echo "already pushed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "210: Probe push from the job token"
          git push origin "HEAD:${{ github.head_ref }}"
