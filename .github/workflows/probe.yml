# Throwaway, for the follow-up to card 210. Second measurement on this pull request: whether
# the job token, with the permissions dispatch-review.yml would declare, can disable an
# auto-merge that the owner's token armed. Runs on this branch's own events, with the job
# token, and prints what GitHub answers. Deleted with the branch.
name: probe
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  disarm:
    if: github.head_ref == '210-probe-concurrency' && github.actor != 'github-actions[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "auto-merge before: $(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // "none"')"
          if gh pr merge "$PR" --disable-auto; then echo "disable-auto: accepted"; else echo "disable-auto: refused, exit $?"; fi
          echo "auto-merge after: $(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // "none"')"
