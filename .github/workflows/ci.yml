# Continuous integration: the CLAUDE.md gates that exist today, on both operating
# systems the ten-minute path promises (CLAUDE.md, invariant 5). It runs on every push
# to master, on every pull request, and by hand.
#
# Every action is pinned to a full commit SHA with its version in a trailing comment.
# Tags are mutable: the tj-actions compromise of March 2025 was delivered by moving
# tags. Dependabot (.github/dependabot.yml) opens a pull request when a pinned action
# has a new release; this workflow runs on that pull request before it merges.
#
# The gates jobs run on Blacksmith runners (ADR 0004), the two labels Brigade's CI uses.
# Blacksmith serves the GitHub Actions cache API from its own backend, so the Rust
# cache action below works unchanged; the restore lines in a run's log are the proof.
# The three cavalry-shm gates of CLAUDE.md's gate 1, `just conformance`, `just loom`
# and `just miri`, run in the gates jobs too (GitHub issue 9). `gates (linux)` is a
# required check, so no pull request merges without them, and a gates job that has
# failed is a blocker in the reviewer's brief (`.claude/agents/reviewer.md`).
# `gates (macos)` runs the same steps for pushes to master and runs by hand, not for
# pull requests, and is not a required check (ADR 0073): in 92 runs it failed alone
# twice, both times an intermittent failure no change caused, and it set the time of
# every run that takes no bench host. A failure it finds on master is the landing
# session's to fix forward, which the `pr` skill's last step, the wait for master's
# run, is there to see.
# The latency gate takes no host for a change (ADR 0139): it runs each night and on
# demand in .github/workflows/bench.yml, on the two dedicated bench hosts, as a coarse
# check, until the slice that measures Cavalry against Aeron arms it again. What holds
# invariant 2 in every pull request needs no quiet host and runs in the gates jobs: the
# allocation tests of `just test`, the lints of `just lint`, and the harness itself,
# which fails on an allocation in a measured loop.
#
# The job names are stable on purpose: "gates (linux)" is the one check branch protection
# on master requires, since the owner dropped the three bench names from the rule with
# ADR 0139; "gates (macos)" is not required, since ADR 0073. Renaming "gates (linux)"
# means updating the protection rule in the same change. "bench (linux)", "bench (grip)"
# and "bench (udp)" are jobs of bench.yml alone.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A bound for a hung runner, not a measurement. With the three cavalry-shm gates
    # and a cold cache the jobs took 1 min 53 s (macOS) and 2 min 40 s (Linux) on run
    # 38298993157, and 35 s warm before them (run 38286062189). `just miri` is the
    # long step, 57 s and 80 s: Miri's sysroot build, 12 s and 20 s, is not in the
    # cache, and the rest is the interpreted tests. Re-measure when `just miri` nears
    # five minutes, when it moves to a job of its own.
    # On 2026-11-15 the jobs took 13 min 18 s (macOS) and 10 min 51 s (Linux) on run
    # 43766622479, with the cluster's tests and the six conformance runners that the
    # fifth slice added, and `just conformance` then gained conformance/upgrade/, which
    # builds a second tree of Cavalry on every run: the cache never holds that tree's
    # programs, since Swatinem/rust-cache drops built programs when it saves. That
    # build took 10 s on Linux in run 43773022696, where the job took 11 min 19 s (work
    # item 231; ADR 0136). Twice the slowest of those is under 27 minutes, so the
    # bound is 30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Linux for every event; macOS as well for a push to master and a run by hand,
      # and not for a pull request (ADR 0073). The names stay "gates (linux)" and
      # "gates (macos)".
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"name":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"}]}' || '{"include":[{"name":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},{"name":"macos","runner":"blacksmith-6vcpu-macos-latest"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # `just lint-docs` diffs the change against its base (ADR 0006)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Node for the Node client's addon, which `just conformance` builds with npm's own
      # node-gyp, and for conformance/node (ADR 0046, card 206). Nothing from the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Go for the Go client, which `just conformance` builds through cgo against the
      # header and the static library, and for conformance/go (ADR 0046, card 207). The
      # version is clients/go/go.mod's; nothing comes from a module proxy.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: clients/go/go.mod
          cache: false
      # Java for the JVM client, which `just conformance` compiles with the runner's
      # javac and runs through java.lang.foreign over the shared library, and for
      # conformance/jvm (ADR 0046, card 208): Temurin's Java 25, the long-term release
      # the client needs; no build tool and nothing from a package registry.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      # .NET for the .NET client, which `just conformance` builds with the runner's SDK and
      # runs through P/Invoke over the shared library, and for conformance/dotnet (ADR
      # 0046, card 209): .NET 10, the long-term release the client needs; no package
      # reference, nothing from a package registry.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # mdBook for `just docs`, as a prebuilt binary checked against the action's own
      # manifest, pinned to the version the justfile names; bump both together (ADR 0006).
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # mdbook for `just docs`; cbindgen for `just lint`'s header check (ADR 0051).
          tool: mdbook@0.5.4,cbindgen@0.29.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Nightly for `just miri`, after the cache step: the cache key hashes every
      # installed toolchain, and a nightly in it would move the key every day and leave
      # the stable build cold. The nightly is the current one, as it is on a developer's
      # machine: the justfile says `+nightly`, and a nightly that breaks Miri fails as a
      # build error, not as a verdict on cavalry-shm. The action makes what it installs
      # the default, so stable is restored as the default right after.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: miri
      - run: rustup default stable
      - run: just lint
      - run: just test
      # A driver whose directory has no room for a log (CLAUDE.md, gate 3, "shm
      # exhaustion"; ADR 0172). The failure is Linux's: making a new log's pages
      # resident fails on a filesystem that cannot back them, after the file exists.
      # The runner mounts the small filesystem, 64 MiB as a container's default
      # /dev/shm is, since a test cannot.
      # The kernel's release is printed because the failure needs its populate advice,
      # 5.14 and later: on an earlier one the test dies of a bus error (work item 497).
      - if: runner.os == 'Linux'
        run: |
          uname -r
          sudo mkdir -p /mnt/cavalry-no-room
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs /mnt/cavalry-no-room
          just shm-exhaustion /mnt/cavalry-no-room
      # The three cavalry-shm gates (CLAUDE.md, gate 1): the vector suites, the loom
      # models and Miri, on each operating system the job runs on. The bench host runs
      # none of them.
      # When `just miri` passes about five minutes, it moves to a job of its own on Linux.
      - run: just conformance
      - run: just loom
      - run: just miri
      - run: just docs
      - run: just lint-docs
      # The README's ten-minute path, end to end (CLAUDE.md, gate 5; ADR 0007's
      # acceptance test for the first slice): on Linux for every change, and on macOS
      # too for every commit on master (ADR 0073).
      - run: just quickstart
      # A client's package as a user installs it (work item 469; ADR 0166): the Python
      # client's wheel, built with the shared library inside by the package's own
      # backend, installed into a new environment outside the checkout, and the
      # client README's example run there; then the same wheel without its library,
      # which must fail. The runner's own Python 3 and its venv; nothing from a
      # package index. On Linux for every change and on macOS too for every commit on
      # master, as the job's other steps are (ADR 0073).
      - run: just package
      - run: just replay-check
      # The harness on a shared runner is a report (ADR 0016): the table is in the log
      # and the result is an artifact, with no comparison of its numbers. It is a gate
      # in one respect, which needs no quiet host: an allocation in a measured loop
      # fails it. The comparison runs each night in bench.yml (ADR 0139).
      - run: just bench --messages 5000000
        env:
          CAVALRY_BENCH_PROFILE: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-${{ matrix.name }}
          path: bench/results/
          if-no-files-found: ignore
