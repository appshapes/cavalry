# Continuous integration: the CLAUDE.md gates that exist today, on both operating
# systems the ten-minute path promises (CLAUDE.md, invariant 5). It runs on every push
# to master, on every pull request, and by hand.
#
# Every action is pinned to a full commit SHA with its version in a trailing comment.
# Tags are mutable: the tj-actions compromise of March 2025 was delivered by moving
# tags. Dependabot (.github/dependabot.yml) opens a pull request when a pinned action
# has a new release; this workflow runs on that pull request before it merges.
#
# The gates jobs run on Blacksmith runners (ADR 0004), the two labels Brigade's CI uses.
# Blacksmith serves the GitHub Actions cache API from its own backend, so the Rust
# cache action below works unchanged; the restore lines in a run's log are the proof.
# The three cavalry-shm gates of CLAUDE.md's gate 1, `just conformance`, `just loom`
# and `just miri`, run in the gates jobs too (GitHub issue 9), so the reviewer's rule
# of ADR 0005, CI green on the head under review, covers them.
# The latency gate runs on the dedicated bench host, a self-hosted runner, because a
# shared runner cannot tell a regression from its own noise (ADR 0016).
#
# The job names are stable on purpose: "gates (linux)", "gates (macos)" and
# "bench (linux)" are the checks branch protection on master requires, so renaming a
# job means updating the protection rule in the same change.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A bound for a hung runner, not a measurement. With the three cavalry-shm gates
    # and a cold cache the jobs took 1 min 53 s (macOS) and 2 min 40 s (Linux) on run
    # 38298993157, and 35 s warm before them (run 38286062189). `just miri` is the
    # long step, 57 s and 80 s: Miri's sysroot build, 12 s and 20 s, is not in the
    # cache, and the rest is the interpreted tests. Twice the slowest cold job is under
    # six minutes, so this stays at 15. Re-measure when `just miri` nears five minutes,
    # when it moves to a job of its own.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # `just lint-docs` diffs the change against its base (ADR 0006)
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # mdBook for `just docs`, as a prebuilt binary checked against the action's own
      # manifest, pinned to the version the justfile names; bump both together (ADR 0006).
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: mdbook@0.5.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Nightly for `just miri`, after the cache step: the cache key hashes every
      # installed toolchain, and a nightly in it would move the key every day and leave
      # the stable build cold. The nightly is the current one, as it is on a developer's
      # machine: the justfile says `+nightly`, and a nightly that breaks Miri fails as a
      # build error, not as a verdict on cavalry-shm. The action makes what it installs
      # the default, so stable is restored as the default right after.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly
          components: miri
      - run: rustup default stable
      - run: just lint
      - run: just test
      # The three cavalry-shm gates (CLAUDE.md, gate 1): the vector suites, the loom
      # models and Miri, on both operating systems. The bench host runs none of them.
      # When `just miri` passes about five minutes, it moves to a job of its own on Linux.
      - run: just conformance
      - run: just loom
      - run: just miri
      - run: just docs
      - run: just lint-docs
      # The harness on a shared runner is a report, not a gate (ADR 0016): the table is
      # in the log and the result is an artifact, with no comparison. The gate is the
      # bench job below.
      - run: just bench --messages 5000000
        env:
          CAVALRY_BENCH_PROFILE: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-${{ matrix.name }}
          path: bench/results/
          if-no-files-found: ignore

  # The latency gate (CLAUDE.md, gate 2; ADR 0015, ADR 0016): the harness pinned to three
  # isolated cores of the dedicated bench host, then the comparison with
  # bench/baseline.json for the host's profiles. docs/how-to/set-up-a-bench-host.md is
  # the host. A self-hosted runner on a public repository must never run a stranger's
  # code, so the job runs on pushes and on pull requests from this repository only; a
  # fork's pull request skips it, which branch protection counts as passing, and the
  # fork's change meets the gate when a maintainer pushes it.
  bench:
    name: bench (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bench-linux]
    # The build is incremental on the persistent runner, so this bounds a hung host, not
    # a build: the first run compiled the workspace in release in under three minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # No cache action: the runner keeps its target directory between runs, and the
      # bench host is not to spend its run uploading it.
      # The host's state opens every log, and a host that lost its tuning fails here.
      - run: bench/host/check.sh 8,10,12
      # Twenty-one runs per benchmark: the gate reads each one's median p99.99, and the
      # result keeps all twenty-one (ADR 0016).
      - run: just bench --messages 5000000 --repeat 21 --pin 8,10,12
        env:
          CAVALRY_BENCH_PROFILE: bench-linux
      - run: just bench-compare
      # The same run with the checks built out, so that ADR 0010's cost is measured on
      # every commit; its profile is bench-linux-unchecked, with a baseline of its own.
      - run: just bench-unchecked --messages 5000000 --repeat 21 --pin 8,10,12
        env:
          CAVALRY_BENCH_PROFILE: bench-linux
      - run: just bench-compare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-bench-linux
          path: bench/results/
          if-no-files-found: ignore
