# Continuous integration: the CLAUDE.md gates that exist today, on both operating
# systems the ten-minute path promises (CLAUDE.md, invariant 5). It runs on every push
# to master, on every pull request, and by hand.
#
# Every action is pinned to a full commit SHA with its version in a trailing comment.
# Tags are mutable: the tj-actions compromise of March 2025 was delivered by moving
# tags. Dependabot (.github/dependabot.yml) opens a pull request when a pinned action
# has a new release; this workflow runs on that pull request before it merges.
#
# The gates jobs run on Blacksmith runners (ADR 0004), the two labels Brigade's CI uses.
# Blacksmith serves the GitHub Actions cache API from its own backend, so the Rust
# cache action below works unchanged; the restore lines in a run's log are the proof.
# The three cavalry-shm gates of CLAUDE.md's gate 1, `just conformance`, `just loom`
# and `just miri`, run in the gates jobs too (GitHub issue 9), so the reviewer's rule
# of ADR 0005, CI green on the head under review, covers them.
# The latency gate runs on the two dedicated bench hosts, bench and grip, self-hosted
# runners, because a shared runner cannot tell a regression from its own noise (ADR 0016,
# ADR 0034); kip ran it beside them from 2026-10-29 to 2026-10-31 and is the soak host.
# The link rows run across the direct cable between the two hosts as a pair of jobs that
# meet over it once both single-host bench jobs are done (ADR 0039, ADR 0044).
#
# The job names are stable on purpose: "gates (linux)", "gates (macos)", "bench (linux)"
# and "bench (grip)" are the checks branch protection on master requires, and
# "bench (udp)" joins them by hand once it has run green on master with its baseline
# (its comment below); "bench (udp peer)" is never required, since bench (udp) fails
# with it. Renaming a job means updating the protection rule in the same change, and,
# for `bench (udp)` and `bench (udp peer)`, the partner name the other job's wait is
# given (card 212); the `Workflow` test of scripts/wait-for-partner-job-test.py fails on
# a missed rename.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A bound for a hung runner, not a measurement. With the three cavalry-shm gates
    # and a cold cache the jobs took 1 min 53 s (macOS) and 2 min 40 s (Linux) on run
    # 38298993157, and 35 s warm before them (run 38286062189). `just miri` is the
    # long step, 57 s and 80 s: Miri's sysroot build, 12 s and 20 s, is not in the
    # cache, and the rest is the interpreted tests. Twice the slowest cold job is under
    # six minutes, so this stays at 15. Re-measure when `just miri` nears five minutes,
    # when it moves to a job of its own.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # `just lint-docs` diffs the change against its base (ADR 0006)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Node for the Node client's addon, which `just conformance` builds with npm's own
      # node-gyp, and for conformance/node (ADR 0046, card 206). Nothing from the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # mdBook for `just docs`, as a prebuilt binary checked against the action's own
      # manifest, pinned to the version the justfile names; bump both together (ADR 0006).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          # mdbook for `just docs`; cbindgen for `just lint`'s header check (ADR 0051).
          tool: mdbook@0.5.4,cbindgen@0.29.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Nightly for `just miri`, after the cache step: the cache key hashes every
      # installed toolchain, and a nightly in it would move the key every day and leave
      # the stable build cold. The nightly is the current one, as it is on a developer's
      # machine: the justfile says `+nightly`, and a nightly that breaks Miri fails as a
      # build error, not as a verdict on cavalry-shm. The action makes what it installs
      # the default, so stable is restored as the default right after.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: miri
      - run: rustup default stable
      - run: just lint
      - run: just test
      # The three cavalry-shm gates (CLAUDE.md, gate 1): the vector suites, the loom
      # models and Miri, on both operating systems. The bench host runs none of them.
      # When `just miri` passes about five minutes, it moves to a job of its own on Linux.
      - run: just conformance
      - run: just loom
      - run: just miri
      - run: just docs
      - run: just lint-docs
      # The README's ten-minute path, end to end, on both operating systems (CLAUDE.md,
      # gate 5; ADR 0007's acceptance test for the first slice).
      - run: just quickstart
      - run: just replay-check
      # The harness on a shared runner is a report, not a gate (ADR 0016): the table is
      # in the log and the result is an artifact, with no comparison. The gate is the
      # bench job below.
      - run: just bench --messages 5000000
        env:
          CAVALRY_BENCH_PROFILE: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-${{ matrix.name }}
          path: bench/results/
          if-no-files-found: ignore

  # The latency gate (CLAUDE.md, gate 2; ADR 0015, ADR 0016): the harness pinned to the
  # four isolated cores of the dedicated bench host, the fourth for the UDP rows'
  # receiver (ADR 0044), then the comparison with bench/baseline.json for the host's
  # profiles. docs/how-to/set-up-a-bench-host.md is
  # the host. A self-hosted runner on a public repository must never run a stranger's
  # code, so the job runs on pushes and on pull requests from this repository only; a
  # fork's pull request skips it, which branch protection counts as passing, and the
  # fork's change meets the gate when a maintainer pushes it.
  bench:
    name: bench (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bench-linux]
    # The build is incremental on the persistent runner, so this bounds a hung host, not
    # a build: the first run compiled the workspace in release in under three minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # No cache action: the runner keeps its target directory between runs, and the
      # bench host is not to spend its run uploading it.
      # The host's state opens every log, and a host that lost its tuning fails here.
      - run: bench/host/check.sh 8,10,12,14
      # Twenty-one runs per benchmark: the gate reads each one's median p99.99, and the
      # result keeps all twenty-one (ADR 0016).
      - run: just bench --messages 5000000 --repeat 21 --pin 8,10,12,14
        id: bench
        env:
          CAVALRY_BENCH_PROFILE: bench-linux
      - run: just bench-compare
      # The same run with the checks built out, so that ADR 0010's cost is measured on
      # every commit; its profile is bench-linux-unchecked, with a baseline of its own.
      # It runs when the checked comparison failed too, so that every run yields both
      # profiles' results, since a baseline is every process of the job at one tree
      # (ADR 0033); it does not run after a failed check.sh or a failed checked bench,
      # whose host or harness is not one to record from. Its comparison runs only when
      # it wrote a result, or `bench-compare` would judge the checked result twice.
      - run: just bench-unchecked --messages 5000000 --repeat 21 --pin 8,10,12,14
        id: unchecked
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        env:
          CAVALRY_BENCH_PROFILE: bench-linux
      - run: just bench-compare
        if: ${{ !cancelled() && steps.unchecked.outcome == 'success' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-bench-linux
          path: bench/results/
          if-no-files-found: ignore

  # The same gate on the second bench host, grip (docs/how-to/set-up-a-bench-host.md,
  # "Further hosts"; ADR 0034), against its own baselines, grip-linux and
  # grip-linux-unchecked: a data-plane change meets the gate on both hosts. Its first
  # runs report `no baseline` and pass until the baselines are recorded from three of
  # them at one tree (ADR 0033). The same guard as above keeps a stranger's code off
  # the host.
  bench-grip:
    name: bench (grip)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, grip-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: bench/host/check.sh 4,5,6,7
      - run: just bench --messages 5000000 --repeat 21 --pin 4,5,6,7
        id: bench
        env:
          CAVALRY_BENCH_PROFILE: grip-linux
      - run: just bench-compare
      # Both profiles on every run whose checked bench ran, as above (ADR 0033).
      - run: just bench-unchecked --messages 5000000 --repeat 21 --pin 4,5,6,7
        id: unchecked
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        env:
          CAVALRY_BENCH_PROFILE: grip-linux
      - run: just bench-compare
        if: ${{ !cancelled() && steps.unchecked.outcome == 'success' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-grip-linux
          path: bench/results/
          if-no-files-found: ignore

  # The link rows (ADR 0039, ADR 0044): udp_round_trip_32, measured on bench's clock
  # alone and gated against its own profile, bench-linux-link, and udp_one_way_32,
  # reported beside it with the offset between the two hosts' clocks, which this job
  # prints after the run from `chronyc tracking` on bench, since bench serves its cooked
  # time and grip stands at bench's raw clock plus that line. The harness on bench
  # publishes across the direct cable to a peer mode of the
  # harness on grip, the job below, which echoes every message back; the two jobs are
  # one pair, started together once both single-host bench jobs are done, so that
  # neither host runs a bench while the other measures the link, and each waits up to
  # ten minutes for the other. The same guard as above keeps a stranger's code off the
  # hosts; the pair is skipped with the jobs it needs. Its baseline is recorded from
  # three of its processes at one tree, as the host's are (ADR 0033), and the check
  # joins master's required checks by hand once it has run green there.
  bench-udp:
    name: bench (udp)
    needs: [bench, bench-grip]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bench-linux]
    # The pair's wait for each other, up to 45 minutes, plus the run (card 212).
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read             # the run's jobs, for the wait below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: bench/host/check.sh 8,10,12,14
      # Each end of the pair queues on its own host once `bench` and `bench-grip` end,
      # and the harness waits ten minutes for the other end; a partner queued behind
      # another run's job for longer than that left the first end dead (card 212). So
      # each job waits here, doing nothing, until the run's other job is in progress.
      - run: scripts/wait-for-partner-job.sh "bench (udp peer)"
        env:
          GH_TOKEN: ${{ github.token }}
      # One message in flight at a time, so a run is its messages times the round trip:
      # 100,000 at about 100 µs is ten seconds a run, twenty-one runs, after the UDP
      # rows' warm-up of 10,000 each. bench-link and grip-link are the cable's ends in
      # both hosts' /etc/hosts (docs/how-to/set-up-a-bench-host.md, "Further hosts").
      - run: just bench --link-here bench-link:40182 --link-peer grip-link:40183 --messages 100000 --repeat 21 --pin 8,10,12,14
        env:
          CAVALRY_BENCH_PROFILE: bench-linux
      - run: just bench-compare
      # The offset the one-way row carries is this host's: chronyd serves its cooked
      # time, the system clock plus the residual it has still to apply against its
      # internet sources, and grip follows that, so grip's clock stands at bench's raw
      # clock plus the "System time" line below, hundreds of microseconds that move with
      # the pools, while grip's own error against bench-link is nanoseconds
      # (docs/how-to/set-up-a-bench-host.md, "Further hosts", the clock).
      - run: chronyc tracking
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results-bench-linux-link
          path: bench/results/
          if-no-files-found: ignore

  # The other end of the pair: the harness on grip in its echo mode, which subscribes on
  # grip's end of the cable, claims every message it receives on a publication back to
  # bench with grip's wall clock stamped in, and ends when the stream does. It writes no
  # result; the one-way row is on bench's side. After it, grip's view of the clock: it
  # follows bench over the cable with hardware timestamps, selecting bench-link alone,
  # and `chronyc sourcestats` names its error against bench-link, nanoseconds; the
  # offset the one-way row carries is on bench's side, printed by its own job, since
  # bench serves its cooked time and grip stands at bench's raw clock plus bench's
  # residual (card 182).
  bench-udp-peer:
    name: bench (udp peer)
    needs: [bench, bench-grip]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, grip-linux]
    # The pair's wait for each other, up to 45 minutes, plus the run (card 212).
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read             # the run's jobs, for the wait below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: bench/host/check.sh 4,5,6,7
      # The same wait as bench (udp)'s, for it (card 212).
      - run: scripts/wait-for-partner-job.sh "bench (udp)"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just bench --echo --link-here grip-link:40183 --link-peer bench-link:40182 --pin 4,5,6,7
      - run: chronyc sourcestats -v && chronyc sources -v && chronyc tracking
        if: always()
