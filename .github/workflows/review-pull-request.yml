# The reviewer half of the loop (ADR 0004, ADR 0005). Read-only because the job's
# GITHUB_TOKEN is `contents: read`: a merge and a push are both content writes, so no
# tool the agent holds can perform one. The `deny` list below is the belt: an `allow`
# list that merely omits Write and Edit withholds nothing, because the action grants the
# edit tools by default, so the denial has to be written out. A reviewer that can push
# is not a reviewer.
#
# It runs on master, not on the pull request's own event (ADR 0005): dispatch-review.yml
# starts it with the pull request's number and head commit. Three things follow. The
# workflow file is master's copy, which the Claude action's token exchange validates
# against master and accepts, including for a pull request that changes this file. The
# OIDC token is a plain branch token, which the exchange accepts where it refuses a
# `pull_request_target` one (run 38114955728; claude-code-action issues 713 and 1886).
# And Dependabot's pull requests reach it like any other, because the dispatcher runs
# with the permissions Dependabot's own events withhold. The root checkout is master and
# the pull request's head sits under pr-head/, which nothing executes: no `just`, no
# `cargo`, no write tool, and the agent's own configuration is master's. Only a workflow
# of this repository or a person with write access can dispatch it, and the first step
# refuses a pull request whose head is not in this repository. Adding the `review` label
# to a pull request runs it again, through the dispatcher.
name: review pr

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review
        required: true
        type: string
      head_sha:
        description: The pull request's head commit, the one the review is for
        required: true
        type: string

# One reviewer per pull request, and the newest head wins: the fixer can push more than
# once per cycle, and each stale changes-requested verdict would spend a slot of the
# writer's fix cap on work already superseded. Every dispatch for a pull request lands
# in its group, so a later dispatch cancels an earlier run, and nothing else shares it.
concurrency:
  group: review-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Brigade's bound (ADR 0004, Evidence): fifteen reviewer sessions finished inside
    # six minutes, so thirty is more than five times the longest. Re-measure after the
    # first ten Cavalry sessions and keep it at twice the longest observed.
    timeout-minutes: 30
    permissions:
      contents: read           # the reviewer must not be able to push; this is the boundary
      pull-requests: read      # the verify step reads the reviews; the review itself is posted with the App token
      id-token: write          # claude-code-action's OIDC exchange for the Claude App token
      actions: read
    steps:
      # The inputs come from dispatch-review.yml or from a person with write access.
      # Check their shape before they reach a command line; refuse a pull request whose
      # head is not in this repository, since its code would meet the secrets; and stop
      # quietly when the head has moved on, because the dispatch for the new head is
      # the one that reviews it.
      - name: Check the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be digits, got '$PR_NUMBER'"; exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be a full commit SHA, got '$HEAD_SHA'"; exit 1
          fi
          IFS=$'\t' read -r head_repo head_now < <(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name, .head.sha] | @tsv')
          if [ "$head_repo" != "$GH_REPO" ]; then
            echo "::error::pull request $PR_NUMBER is from $head_repo, not this repository; the reviewer does not run on forks (ADR 0005)"; exit 1
          fi
          if [ "$head_now" != "$HEAD_SHA" ]; then
            echo "::notice::pull request $PR_NUMBER moved from $HEAD_SHA to $head_now; the run dispatched for the new head reviews it"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Base at the root, head in a subdirectory: the pattern the action's own security
      # doc prescribes whenever the head is not the trusted ref (ADR 0005). The root is
      # master, so the working directory, CLAUDE.md and .claude/ are master's. The pull
      # request's head commit, the one the verify step below checks the review against,
      # is under pr-head/ for reading, with full history so `git log` and `git diff` work
      # there, and without the job token in its .git/config, since nothing writes from
      # there.
      - name: Checkout master
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout the pull request head under pr-head/
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          path: pr-head
          fetch-depth: 0       # the reviewer diffs against the merge base; a depth-1 clone has none
          persist-credentials: false

      - name: Review
        id: review                # the verify step below reads this step's outcome into its error line
        if: steps.pr.outputs.proceed == 'true'
        # The verify step at the end of this job decides it, not this step's exit status:
        # the action fails a step whose agent exceeded --max-turns even after it has
        # submitted its review (Brigade, four times in its first week). With this line a
        # submitted review counts; a missing one still fails loud, below.
        continue-on-error: true
        # Pinned by SHA like every action here (ADR 0003), and this one matters most: it
        # runs a model with repository access, so a moving tag would change what an agent
        # does, not how a step behaves. Re-resolve the current `v1` when bumping:
        #   gh api repos/anthropics/claude-code-action/git/ref/tags/v1 --jq '.object.sha'
        #   (an annotated tag needs one more hop: gh api .../git/tags/<sha> --jq '.object.sha')
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          # A dispatched run's actor is the identity that asked for it: github-actions[bot]
          # when dispatch-review.yml did, with the job token, or a person who ran it by
          # hand. Without its name the action rejects the run and the loop dead-ends
          # unreviewed. `github-actions` events can only come from this repository's own
          # workflow tokens. `claude` stays for a run a Claude App identity raises. An
          # explicit list, never '*'.
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --max-turns is a hard stop on a wandering session. 70 is Brigade's measured
          # bound: 1.5 times its largest observed reviewer session (42 turns), rounded up.
          # Re-measure when a Cavalry session reaches 47 turns or the pin moves.
          # --add-dir pr-head: the pull request's tree, checked out above (ADR 0005).
          # Fable 5.1 at xhigh effort (owner, 2026-10-16): the highest reasoning available, for the
          # agents that gate and write this repository. The turn and time bounds were measured
          # on Opus and on Brigade, so the first Fable runs are read for duration.
          claude_args: "--model claude-fable-5-1 --effort xhigh --max-turns 70 --add-dir pr-head"
          # Public repository: run logs are world readable. Keep the agent's output out.
          show_full_output: false
          prompt: |
            You are the reviewer agent. Read `.claude/agents/reviewer.md` for your
            operating instructions and review pull request
            #${{ inputs.pr_number }}.

            The working directory is `master`, the base of the pull request. The
            pull request's head commit is checked out under `pr-head/`: read the
            changed files and their surroundings there. `gh pr view`, `gh pr diff`
            and `gh pr checks` work from the working directory.

            You MUST end your session by actually executing
            `gh pr review ${{ inputs.pr_number }} --approve --body "<summary>"`
            or
            `gh pr review ${{ inputs.pr_number }} --request-changes --body "<findings>"`.
            Your final text response is discarded: a verdict not submitted via
            `gh pr review` does not exist, and this job fails if no review lands.
            If the submission command errors, retry it, and surface a persistent
            failure with `gh pr comment` before ending the session.

            When requesting changes, end the review body with the following
            line, written as plain text on its own line. Do NOT wrap it in
            backticks or quotes, or the fixer's mention detection will not
            match it:

            @claude Read `.claude/agents/developer.md`, then address every blocker in this review: apply the fixes directly on this PR branch and push.

            That line is the only place in the loop that hands the fixer its
            rules file, so never shorten it. Never put an @claude mention in an
            approval body: it would start a needless fix run.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Write",
                  "Edit",
                  "MultiEdit",
                  "NotebookEdit",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }
          # `Bash(gh:*)` includes `gh pr merge`. It cannot merge: the job's GITHUB_TOKEN is
          # `contents: read`, and a merge is a content write. No `just`, no `cargo`: a
          # reviewer that can run the build can also write files through a build script;
          # CI runs the gates on the pull request and the reviewer reads the result.
          # No WebFetch and no WebSearch: a reviewer reads a diff in a checkout it already
          # has, and the token in its environment is reachable to anything it runs.
          # Reviewing a hostile diff is this agent's whole job, so it gets no fetch verb.

      # A reviewer session can end "successfully" without ever submitting the review
      # (observed in Brigade's reference repositories: green check, zero reviews,
      # auto-merge never armed). This step is the job's verdict: a claude review at the
      # head SHA passes, none fails, whatever the action reported.
      - name: Verify a review was submitted
        if: steps.pr.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          # One line per claude review at head: "STATE<TAB>has-trailer". Paginated so a
          # long-lived pull request cannot hide the newest review.
          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select((.user.login // \"\" | startswith(\"claude\")) and .commit_id == \"$HEAD_SHA\") | [.state, (.body // \"\" | contains(\"@claude\") | tostring)] | @tsv")
          if [ -z "$reviews" ]; then
            echo "::error::Reviewer session ended without submitting a formal review at head $HEAD_SHA (the Review step's outcome was '$REVIEW_OUTCOME'; its log says why)"
            exit 1
          fi
          last=$(printf '%s\n' "$reviews" | tail -n 1)
          state=${last%%$'\t'*}
          has_trailer=${last##*$'\t'}
          # A changes-requested verdict without the '@claude' trailer never arms the fixer:
          # the pull request would silently park, so fail loud.
          if [ "$state" = "CHANGES_REQUESTED" ] && [ "$has_trailer" != "true" ]; then
            echo "::error::CHANGES_REQUESTED review at $HEAD_SHA lacks the @claude fixer trailer; the fix loop will not arm"
            exit 1
          fi
