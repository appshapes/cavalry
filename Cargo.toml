# Cavalry workspace. CLAUDE.md's repository map says what each crate is; ADR 0003
# (docs/decisions/) records the decisions behind this file.
[workspace]
resolver = "3"
members = ["crates/*", "bench"]

# One version for the whole family: `cavalry` is the product version (ADR 0002).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/appshapes/cavalry"

# `unsafe` is permitted in cavalry-shm and cavalry-ffi only (CLAUDE.md, "Unsafe").
# Every other crate inherits this table with `[lints] workspace = true`; those two
# carry their own [lints.rust] table instead. `just lint-workspace` checks both.
[workspace.lints.rust]
unsafe_code = "deny"
# `cfg(cavalry_unchecked)` builds the data-plane checks out, to measure what they cost
# (ADR 0010). Only `just bench-unchecked` sets it; no shipped build has it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cavalry_unchecked)"] }
