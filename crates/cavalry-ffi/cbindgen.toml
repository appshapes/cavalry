# The committed header, crates/cavalry-ffi/include/cavalry.h, is written from this
# crate by cbindgen 0.29.4 with this configuration; `just lint-header` regenerates it
# and fails when the committed file differs (spec/c-abi.md, ADR 0051). cbindgen is a
# tool `just lint` runs, not a dependency of the crate.
language = "C"
include_guard = "CAVALRY_H"
autogen_warning = "/* Generated by cbindgen 0.29.4 from crates/cavalry-ffi (just lint-header); do not edit by hand. The ABI this header declares is spec/c-abi.md, version 0 (ADR 0051). */"
include_version = false
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
cpp_compat = true
# What cbindgen does not write from Rust, inside the include guard: a string constant,
# the environment variable a context's default directory reads (spec/c-abi.md,
# "Constants"), and the header's one macro, its own version passed by default
# (spec/c-abi.md, "Versions and what a reader rejects").
after_includes = """

/* The environment variable a context's default directory reads. */
#define CAVALRY_DIR_ENV "CAVALRY_DIR"

/* The header's own version, passed to the library by default, so that a program built
   against another version is refused at its first call (spec/c-abi.md, "Versions and
   what a reader rejects"). */
#define cavalry_context_init(context) cavalry_context_init_v((context), CAVALRY_ABI_VERSION)
"""
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true
[parse]
parse_deps = false

[export]
# Everything the crate exports under its own names; nothing is renamed or prefixed.

[fn]
args = "vertical"

[const]
allow_static_const = false
allow_constexpr = false
