[package]
name = "cavalry-proto"
description = "Wire types, zerocopy frames and version negotiation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# The derives that make a wire struct its layout table (ADR 0009). No default
# features: the derive is all the data plane needs.
zerocopy = { version = "0.8.62", default-features = false, features = ["derive"] }

[dev-dependencies]
# Reads spec/vectors/*.json in tests/conformance.rs. Dev only, never on the data plane.
serde_json = "1"

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe") and the check-cfg for
# `cavalry_unchecked`, which only `just bench-unchecked` sets (ADR 0010).
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = true
allowed-dependencies = ["zerocopy"]
