[package]
name = "cavalry"
description = "Aeron-class latency without Aeron-class expertise: the client API, an embeddable driver and the cavalry binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# The client API, re-exported: `cargo add cavalry` gives `Cavalry`, `Publication` and
# `Subscription` (ADR 0002; ADR 0021).
cavalry-client = { path = "../cavalry-client" }
# The embeddable driver, re-exported: `cargo add cavalry` gives it (ADR 0002).
cavalry-driver = { path = "../cavalry-driver" }
# The time index lookup, re-exported as `cavalry::index`: what resolves an instant to
# a position for `cavalry replay --from <instant>` and for a program (ADR 0030).
cavalry-log = { path = "../cavalry-log" }
# `cavalry doctor`, control plane, behind `cli`.
cavalry-control = { path = "../cavalry-control", optional = true }
# `cavalry run` stops on SIGINT, SIGTERM and SIGHUP: the handler std does not have.
# Behind `cli`, on the control plane, never on the data plane.
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }

# Control-plane and CLI dependencies sit behind `cli`, default on, so that
# `cargo install cavalry` needs no flag and `cargo add cavalry --no-default-features`
# is the lean library build (ADR 0002).
[features]
default = ["cli"]
cli = ["dep:cavalry-control", "dep:ctrlc"]

[[bin]]
name = "cavalry"
path = "src/main.rs"
required-features = ["cli"]

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = false
