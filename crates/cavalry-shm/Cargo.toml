[package]
name = "cavalry-shm"
description = "Memory-mapped log buffers, ring buffers and the counters file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# The frames a term holds are cavalry-proto's; the log buffer's reader checks each one
# with DataFrameHeader::parse_within (spec/log-buffer.md, "Reading"; ADR 0013).
cavalry-proto = { path = "../cavalry-proto" }
# The memory map behind every shared layout (ADR 0012). Nothing else on the data plane.
memmap2 = "0.9.11"
# The derives that make a layout struct its spec table (ADR 0009): the header and record
# encodings of spec/counters-file.md are little-endian views over plain bytes.
zerocopy = { version = "0.8.62", default-features = false, features = ["derive"] }
# `openat`, to make a client's lock file through a handle on `clients/` and not by a
# path (src/client_lock.rs; ADR 0179): the standard library makes a file by a path
# alone, and a path names another driver's directory once a driver has started again.
# `fs` carries the call and its flags. The version the driver already takes, so nothing
# new enters the lock file, and it carries the `unsafe` the call needs. Never on a
# message's path: a client makes one file when it attaches.
nix = { version = "0.32", default-features = false, features = ["fs"] }

# `fallocate`, which the standard library does not have: a new shared file is given its
# room before it is mapped, so that a directory with no room is an error and never a bus
# error (src/allocate.rs; ADR 0175). `fs` is that call and the question of a tmpfs's free
# room; `signal` is the thread's signal mask, which holds every signal off the call. On
# the control plane only, where a file is created; nix is the crate the driver and the
# client already take, and its wrappers keep the `unsafe` of the calls out of this crate.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.32", default-features = false, features = ["fs", "signal"] }

[dev-dependencies]
# Model checker for the publish protocols in src/counters/cells.rs: `just loom`.
loom = "0.7"
# Reads spec/vectors/*.json in tests/conformance.rs. Dev only, never on the data plane.
serde_json = "1"

# One of the two crates where `unsafe` is permitted (CLAUDE.md, "Unsafe"). It cannot
# inherit the workspace table, which denies unsafe_code, so it carries its own. Every
# `unsafe` block here needs a `// SAFETY:` comment; see .claude/rules/data-plane.md.
# `cfg(loom)` is set by `just loom`, which swaps the atomics for loom's;
# `cfg(cavalry_unchecked)` by `just bench-unchecked` alone, to measure the checks (ADR 0010).
[lints.rust]
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(cavalry_unchecked)"] }

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = true
allowed-dependencies = ["memmap2", "nix", "zerocopy"]
