[package]
name = "cavalry-control"
description = "Admin API, discovery, OpenTelemetry export and configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# `doctor` reads the driver's directory through the shared layouts' read-only openers:
# the counters file, the command ring and the broadcast buffer (ADRs 0012 to 0014).
cavalry-shm = { path = "../cavalry-shm" }

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = false
