[package]
name = "cavalry-raft"
description = "Replicated state machine on top of cavalry-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = true
allowed-dependencies = []

[dependencies]
# The cluster protocol: the consensus messages and the log's entries the core reads and
# writes, and the rules of `spec/cluster.md` it decides by, the commit position, what a
# reader does with new leadership term, the appointed leader (ADR 0058; ADR 0063). A
# workspace member.
cavalry-proto = { path = "../cavalry-proto" }

[dev-dependencies]
# The counting allocator of the allocation test, so that the core's zero-allocation
# claim is a test (CLAUDE.md, gate 2), as in `cavalry-client`. Dev only.
stats_alloc = "0.1"
