[package]
name = "cavalry-driver"
description = "The daemon: conductor, sender, receiver and idle strategies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# The shared layouts the driver creates and keeps: the counters file, the command ring,
# the broadcast buffer and every publication's log buffer (ADRs 0012 to 0014).
cavalry-shm = { path = "../cavalry-shm" }
# The commands the conductor decodes and the events it answers with (ADR 0019).
cavalry-proto = { path = "../cavalry-proto" }
# The durable log the recorder thread writes: the log directory under its lock, the
# recovery pass, and the recording writer (ADR 0025). A workspace member.
cavalry-log = { path = "../cavalry-log" }
# The socket calls `std` lacks, on a `std::net::UdpSocket`'s descriptor (ADR 0041):
# `sendmmsg` per burst on Linux and `sendmsg` per datagram elsewhere, `recvmmsg` and
# `recvmsg` for the control frames an endpoint receives, and the socket buffer lengths
# read back into the endpoint's counters. `socket` carries the module and the options,
# `uio` the message calls and their preallocated headers, `net` the address types the
# receiver (card 181) reads a datagram's source from; none allocates per call. It
# carries the `unsafe` the calls need, so this crate carries none.
nix = { version = "0.31", default-features = false, features = ["socket", "uio", "net"] }

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here;
# workspace crates need no entry.
[package.metadata.cavalry]
data_plane = true
allowed-dependencies = ["nix"]
