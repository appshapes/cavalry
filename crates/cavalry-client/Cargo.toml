[package]
name = "cavalry-client"
description = "Client API implementation, re-exported by the cavalry crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# crates.io holds a 0.0.0 placeholder for this name (ADR 0002). Nothing is releasable
# until the first release (ADR 0003).
publish = false

[dependencies]
# The shared layouts a client opens: the command ring, the broadcast buffer, the counters
# file and every publication's log buffer, and the in-process queue between the client's
# two threads (ADRs 0012 to 0014, 0021).
cavalry-shm = { path = "../cavalry-shm" }
# The commands a client sends and the events it reads (ADR 0019).
cavalry-proto = { path = "../cavalry-proto" }

[dev-dependencies]
# The tests run a real driver in the test process (ADR 0007: one driver, Rust clients).
cavalry-driver = { path = "../cavalry-driver" }
# The recording test reads the catalog's stop back (ADR 0025). Dev only.
cavalry-log = { path = "../cavalry-log" }

# Inherits unsafe_code = "deny" (CLAUDE.md, "Unsafe").
[lints]
workspace = true

# Read by `just lint`. A data-plane crate gets the lock, async and dependency rules
# from CLAUDE.md, "Data plane", and every dependency it takes must be listed here.
[package.metadata.cavalry]
data_plane = true
allowed-dependencies = []
